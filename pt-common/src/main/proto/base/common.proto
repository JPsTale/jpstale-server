syntax = "proto3";
package jpt.base;
option java_package = "org.jpstale.server.proto.base";
option java_outer_classname = "CommonProto";

// 位置
message Position {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 向量
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 错误码
enum ErrorCode {
  SUCCESS = 0;
  UNKNOWN_ERROR = 1;
  NOT_LOGIN = 2;
  ALREADY_LOGIN = 3;
  INVALID_PASSWORD = 4;
  ACCOUNT_BANNED = 5;
  CHARACTER_NOT_FOUND = 6;
  CHARACTER_LIMIT = 7;
  INVALID_MAP = 8;
  POSITION_INVALID = 9;
  SPEED_HACK = 10;
  TELEPORT_HACK = 11;
  INVINCIBLE_HACK = 12;
  INVALID_NAME = 13;
  NAME_EXISTS = 14;
}

// 物品类型
enum ItemType {
  WEAPON = 0;
  ARMOR = 1;
  ACCESSORY = 2;
  CONSUMABLE = 3;
  MATERIAL = 4;
  QUEST = 5;
}

// 怪物状态
enum MonsterState {
  MONSTER_IDLE = 0;
  MONSTER_PATROL = 1;
  MONSTER_CHASE = 2;
  MONSTER_ATTACK = 3;
  MONSTER_RETURN = 4;
  MONSTER_DEAD = 5;
}

// 玩家状态
enum PlayerState {
  PLAYER_ALIVE = 0;
  PLAYER_DEAD = 1;
  PLAYER_SITTING = 2;
}

// 聊天频道
enum ChatChannel {
  CHAT_WORLD = 0;
  CHAT_MAP = 1;
  CHAT_PARTY = 2;
  CHAT_GUILD = 3;
  CHAT_PRIVATE = 4;
  CHAT_SYSTEM = 5;
}

// 技能类型
enum SkillType {
  SKILL_PHYSICAL_ATTACK = 0;
  SKILL_MAGIC_ATTACK = 1;
  SKILL_HEAL = 2;
  SKILL_BUFF = 3;
  SKILL_AOE = 4;
}

// 装备槽位
enum EquipmentSlotType {
  EQUIP_WEAPON = 0;
  EQUIP_HEAD = 1;
  EQUIP_BODY = 2;
  EQUIP_LEGS = 3;
  EQUIP_FEET = 4;
  EQUIP_HANDS = 5;
  EQUIP_ACCESSORY = 6;
  EQUIP_RING = 7;
  EQUIP_NECKLACE = 8;
}

// 物品实例（一物一行，对应 userdb.item）
// location/slot 语义（画布版）：
//   0=背包 12×12 slot=y*12+x(0~143)；1=仓库 9×9 slot=y*9+x(0~80)；
//   2=装备槽(1~13)；6=备用武器槽(1/2)。
message ItemProto {
  int64 uid = 1;            // 物品实例唯一 id（userdb.item.id）
  int32 itemlist_id = 2;    // 定义主键（gamedb.itemlist.id）
  int32 item_code = 3;      // 原版物品码（客户端动画/图标查表）
  int32 location = 4;
  int32 slot = 5;
  int32 count = 6;
  // 掷点实例值（无随机属性的消耗/材料可为 0/不填）
  int32 durability = 7;
  int32 durability_max = 8;
  int32 damage_min = 9;
  int32 damage_max = 10;
  int32 attack_rating = 11;
  int32 defence = 12;
  int32 block_rating = 13;  // 0.1 精度（如 5.0 → 50）
  int32 absorb = 14;        // 0.1 精度
  int32 speed = 15;         // 0.1 精度
  int32 res_bionic = 16;
  int32 res_fire = 17;
  int32 res_ice = 18;
  int32 res_lighting = 19;
  int32 res_poison = 20;
  int32 increase_life = 21;
  int32 increase_mana = 22;
  int32 increase_stamina = 23;
  int32 req_level = 24;
  int32 req_strength = 25;
  int32 req_spirit = 26;
  int32 req_talent = 27;
  int32 req_agility = 28;
  int32 req_health = 29;
  int32 price = 30;
  int32 job_code_mask = 31;
  int32 aging_level = 32;   // 锻造等级（本轮存储，操作逻辑未实现）
}

// 地面物品
message GroundItemProto {
  int64 ground_item_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
  Position position = 4;
  int64 owner_id = 5;
  int64 expire_time = 6;
}

// Buff效果
message BuffEffectProto {
  string type = 1;
  int32 value = 2;
}

// Buff
message BuffProto {
  int64 buff_id = 1;
  int32 skill_id = 2;
  int64 caster_id = 3;
  int32 duration = 4;
  repeated BuffEffectProto effects = 5;
  int64 apply_time = 6;
}

// 朝向/方向角（对应 PT ax/ay/az）
message Rotation {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 角色外观——渲染一个角色所需的最小外观信息（角色选择列表、世界中其他玩家共用）
message CharacterAppearance {
  int32 class_id  = 1;  // 职业(1-10)，决定骨骼/身体前缀/头前缀/种族
  int32 head      = 2;  // 头型/头模型编号(0-2)，配合 rank 决定头模型（PT 无独立 face 字段，脸型即头模型名编号）
  int32 rank      = 3;  // 转职阶级(0-7)，决定头模型后缀(a/b/c)
  string body_model = 4;  // 身体模型 dorpItem（如 "da115"），时装查 COSTUME_BODY_MAP
  int32 body_model_idcode = 5;  // 身体模型 idcode（如 33623808），普通防具算 armorNum
  string weapon_dorp = 6; // 武器 dorpItem（可空，如 "WA102"）
  int32 weapon_idcode = 7; // 武器 idcode（如 0x010A0000），动画匹配按武器类型
  int32 weapon_pos  = 8;  // 武器挂点 modelPosition（2左/4右/0无）
  int32 size_level  = 9;  // 体型缩放（默认 1）
}

// 玩家出现：外观 + 身份 + 位置 + 朝向 + 状态（对应 PT smTRNAS_PLAYERINFO）
message PlayerAppearInfo {
  int64 player_id         = 1;
  string name             = 2;
  int32 level             = 3;
  CharacterAppearance appearance = 4;
  Position position       = 5;
  Rotation rotation       = 6;
  int32 state             = 7;
  int32 hp = 8;
  int32 max_hp = 9;
}
