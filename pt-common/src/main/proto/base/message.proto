}

message S2C_PartyInvite {
  int64 party_id = 1;
  int64 inviter_id = 2;
  string inviter_name = 3;
}

// ==================== 系统消息 (900-999) ====================

message C2S_Ping {
  int64 timestamp = 1;
}

message S2C_Pong {
  int64 timestamp = 1;
}

message S2C_Error {
  ErrorCode error_code = 1;
  string error_message = 2;
  // minecraft 式翻译：key 为翻译键，params 为命名模板参数；
  // key 不在语言表时客户端 fallback 显示 key 本身
  string key = 3;
  map<string, string> params = 4;
}

message S2C_SystemMessage {
  // 兼容纯文本：无 key 时客户端直接显示 message
  string message = 1;
  int64 timestamp = 2;
  // minecraft 式翻译：key 为翻译键，params 为命名模板参数；
  // key 不在语言表时客户端 fallback 显示 key 本身
  string key = 3;
  map<string, string> params = 4;
  // 投递到哪个聊天 tab。**未设置（默认 0）一律按系统消息处理**（客户端只认 CHAT_BATTLE），
  // 所以老的发送方不用改；战斗日志（BattleLogService）显式设 CHAT_BATTLE 走"战斗"tab。
  ChatChannel channel = 5;
}

message S2C_Disconnect {
  string reason = 1;
}

// ==================== NPC 商店 ====================

// NPC 交互（点击世界里的 NPC）。客户端只报**实体 id**，服务端据此查 NPC 定义并校验距离，客户端不上报坐标。
message C2S_NpcInteract {
  int64 entity_id = 1;
}

// 买入：一次一条商品，count 只对可堆叠物（药水）有意义，其余视为 1
message C2S_ShopBuy {
  int64 entity_id = 1;
  int32 itemlist_id = 2;
  int32 count = 3;
}

// 卖出：uid 必须是**自己背包里**的那件（服务端按 uid 查，不信客户端报的位置）
message C2S_ShopSell {
  int64 entity_id = 1;
  int64 uid = 2;
  int32 count = 3;
}

// 商品行（下发用）：名字与码也发过去，客户端即使没有该物品的本地定义也能显示
message ShopItemProto {
  int32 itemlist_id = 1;
  string code = 2;
  string name = 3;
  int64 price = 4;
  // 0=武器 1=防具 2=杂货（对应 npclist 的 weaponshop/defenseshop/miscshop 三列）：
  // 一个 NPC 可以同时是武器店+防具店，所以类别挂在**行**上，客户端按它分组/分页。
  int32 kind = 5;
}

// 打开商店：kind 0=武器 1=防具 2=杂货（对应 npclist 的三列）
message S2C_ShopOpen {
  int64 entity_id = 1;
  int32 kind = 2;
  repeated ShopItemProto items = 3;
}
