<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priston Tale Spawn Debug</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: #141414; color: #e8e8e8; font-family: Tahoma, Arial, sans-serif; font-size: 13px; display: flex; flex-direction: column; }

#top { padding: 10px 16px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
#top h1 { font-size: 15px; color: #ffd479; }
#top .conn { font-size: 12px; color: #888; }
#connStatus { padding: 2px 8px; border-radius: 3px; font-size: 12px; }
#connStatus.on { background: #1d4d1d; color: #7cd47c; }
#connStatus.off { background: #4d1d1d; color: #f85149; }

#body { flex: 1; display: flex; flex-direction: column; min-height: 0; }

/* 阶段一：登录大厅（进游戏前） */
#lobby { flex: 1; display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; overflow-y: auto; }
#lobby .lobbyCol { width: 430px; display: flex; flex-direction: column; gap: 12px; }
#lobby .backBtn { margin-top: 14px; width: 100%; }

/* 阶段二：游戏视图（进游戏后） */
#gameView { flex: 1; display: none; flex-direction: column; min-height: 0; }
#gameToolbar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #333; flex-wrap: wrap; }
#gameToolbar .char { color: #ffd479; font-weight: bold; }
#gameToolbar .view { color: #666; font-size: 11px; }
#mapSel { background: #141414; color: #e8e8e8; border: 1px solid #555; padding: 3px 6px; font-size: 12px; }
#gameToolbar .btn { margin-top: 0; padding: 3px 10px; }

.box { background: #1d1d1d; border: 1px solid #333; padding: 10px; }
.box h2 { font-size: 13px; color: #9db8d9; margin-bottom: 8px; font-weight: bold; }
.box label { display: block; font-size: 12px; color: #9db8d9; margin: 6px 0 3px; }
.box input, .box select { width: 100%; background: #141414; color: #e8e8e8; border: 1px solid #555; padding: 4px 6px; font-size: 13px; }
.btn { display: inline-block; background: #2a2a2a; color: #e8e8e8; border: 1px solid #555; padding: 5px 12px; margin-top: 8px; cursor: pointer; font-size: 13px; }
.btn:hover { background: #3a3a3a; border-color: #ffd479; }
.btn:disabled { opacity: 0.4; cursor: default; }

#charList { list-style: none; }
#charList li { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #2c2c2c; }
#charList li:hover, #charList li.sel { background: #35455a; }
#charList .lv { color: #9db8d9; margin-left: 6px; }

#serverList { list-style: none; }
#serverList li { padding: 5px 8px; cursor: pointer; border-bottom: 1px solid #2c2c2c; }
#serverList li:hover, #serverList li.sel { background: #35455a; }
#serverList .sv { color: #7cd47c; margin-left: 6px; }

#mapSel { margin-top: 4px; }
#logBar { height: 110px; display: flex; flex-direction: column; border-top: 1px solid #333; background: #141414; }
#logBar .legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 12px; align-items: center; }
#logBox { background: #0d0d0d; flex: 1; overflow-y: auto; font-family: Consolas, monospace; font-size: 11px; padding: 6px; color: #9db8d9; border-top: 1px solid #2c2c2c; }
#logBox .err { color: #f85149; }
#logBox .ok { color: #7cd47c; }

#createChar { margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
#createChar h3 { font-size: 12px; color: #ffd479; margin-bottom: 6px; }
#classSel, #headSel { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0; }
.selBtn { background: #2a2a2a; color: #e8e8e8; border: 1px solid #555; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.selBtn.sel { border-color: #ffd479; color: #ffd479; }

#charList li .infoBtn { float: right; margin-left: 6px; font-size: 11px; }
#charList li .st { color: #888; font-size: 11px; display: block; }

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 330px; background: #1d1d1d; border-left: 1px solid #444; z-index: 100; padding: 14px; overflow-y: auto; }
.drawer.hidden { display: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
#infoBody .statRow { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #2c2c2c; }
#infoBody .statRow .name { color: #9db8d9; }
#infoBody .statRow .val { color: #e8e8e8; font-weight: bold; }
#infoBody .panelRow { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; color: #bbb; }
#infoBody .panelRow b { color: #e8e8e8; }
#infoBody .addBtn { background: #3a3a3a; color: #ffd479; border: 1px solid #666; padding: 1px 8px; cursor: pointer; }

canvas { background: #0d0d0d; display: block; width: 100%; height: 100%; cursor: crosshair; }
#maparea { flex: 1; min-height: 0; position: relative; }
.hp { color: #f85149; }
</style>
</head>
<body>
<div id="top">
  <h1>Spawn Debug</h1>
  <span id="connStatus" class="off">DISCONNECTED</span>
  <span class="conn" id="wsUrl"></span>
</div>
<div id="body">
  <div id="lobby">
    <div class="lobbyCol">
      <div class="box" id="loginBox">
        <h2>Login</h2>
        <label>Account</label><input id="acc" value="test_fs_20">
        <label>Password</label><input id="pwd" type="password" value="123">
        <button class="btn" id="btnLogin">Login</button>
      </div>
      <div class="box" id="serverBox" style="display:none">
        <h2>Select Server</h2>
        <ul id="serverList"></ul>
      </div>
      <div class="box" id="charBox" style="display:none">
        <h2>Character</h2>
        <ul id="charList"></ul>
        <div id="createChar">
          <h3>Create New Character</h3>
          <label>Name</label><input id="newCharName" maxlength="12">
          <label>Class</label>
          <div id="classSel"></div>
          <label>Head</label>
          <div id="headSel"></div>
          <button class="btn" id="btnCreate">Create</button>
          <div id="createError" style="display:none;color:#f85149;margin-top:8px;font-size:12px"></div>
        </div>
        <button class="btn backBtn" id="btnBackLogin">&#8592; Back to Login</button>
      </div>
    </div>
  </div>
  <div id="gameView">
    <div id="gameToolbar">
      <span class="char" id="gtChar">-</span>
      <span id="gtStatus">
        Lv <b id="stLevel">-</b> &nbsp; HP <b class="hp" id="stHp">-</b> &nbsp; MP <b id="stMp">-</b> &nbsp; Monsters <b id="stMobs">0</b>
      </span>
      <select id="mapSel"></select>
      <button class="btn" id="btnEnter">Enter Map</button>
      <button class="btn" id="btnInfo">info</button>
      <button class="btn" id="btnLogout">Logout</button>
      <span class="view" id="stView"></span>
      <span class="view" id="stScale"></span>
    </div>
    <div id="maparea">
      <canvas id="cv"></canvas>
    </div>
    <div id="logBar">
      <div class="legend">
        <span style="color:#ff6b6b">&#9679; spawn (active)</span>
        <span style="color:#555">&#9679; spawn (idle)</span>
        <span style="color:#4dabff">&#9679; player</span>
        <span style="color:#c7a5ff">&#9679; other</span>
        <span style="color:#7cd47c">&#9679; monster</span>
        <span style="color:#ffd479">&#9679; chase/attack</span>
        <span style="color:#f85149">&#9679; low hp</span>
      </div>
      <div id="logBox"></div>
    </div>
  </div>
</div>

<div id="infoDrawer" class="drawer hidden">
  <div class="drawer-head">
    <b id="infoTitle" style="color:#ffd479">Character Info</b>
    <button class="btn" id="btnCloseInfo">Close</button>
  </div>
  <div id="infoBody"></div>
</div>

<script>
(function() {
  const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const logBox = document.getElementById('logBox');
  const connStatus = document.getElementById('connStatus');
  const wsUrlText = wsProto + '://' + location.host + '/pt/ws';
  document.getElementById('wsUrl').textContent = wsUrlText;

  let ws = null;
  let state = {
    step: 'login',
    accountId: null,
    servers: [],
    selectedServer: null,
    characters: [],
    selectedChar: null,
    mapId: null,
    player: { x: 0, z: 0, hp: 100, maxHp: 100 },
    spawnPoints: [],
    monsters: [],
    otherPlayers: [],
    mapConfig: null,
    mapName: '',
    bounds: null,
    mapAabbs: {},      // 全部地图 AABB {mapId: {name,xMin,xMax,zMin,zMax}}
    mapMeshes: {},      // mesh 背景 {mapId: {vertices:[...], indices:[...]}}
    mapImages: {}       // 地图背景图缓存 {mapId: Image}
  };
  let reconnectToken = null;   // 断线重连 token
  let reconnectTimer = null;   // 自动重连定时器

  function computeBounds() {
    const xs = state.spawnPoints.map(p => p.x);
    const zs = state.spawnPoints.map(p => p.z);
    if (xs.length === 0) return null;
    return {
      minX: Math.min.apply(null, xs),
      maxX: Math.max.apply(null, xs),
      minZ: Math.min.apply(null, zs),
      maxZ: Math.max.apply(null, zs)
    };
  }

  // ---- view transform ----
  let view = { minX: -1, minZ: -1, maxX: 1, maxZ: 1, scale: 1, ox: 0, oz: 0 };
  // 视野宽(游戏单位)。镜头跟随玩家，宽不变则比例尺恒定；滚轮缩放改变它。
  // 对齐 EU：默认 1800（≈ DISCONNECT 1810），覆盖玩家互见范围
  let viewSpan = 1800;
  function computeView() {
    if (state.player.x === 0 && state.player.z === 0 && state.spawnPoints.length === 0) {
      view.minX = -viewSpan / 2; view.maxX = viewSpan / 2;
      view.minZ = -viewSpan / 2; view.maxZ = viewSpan / 2;
    } else {
      view.minX = state.player.x - viewSpan / 2;
      view.maxX = state.player.x + viewSpan / 2;
      view.minZ = state.player.z - viewSpan / 2;
      view.maxZ = state.player.z + viewSpan / 2;
    }
    const cw = cv.width, ch = cv.height;
    const sx = cw / (view.maxX - view.minX), sz = ch / (view.maxZ - view.minZ);
    view.scale = Math.min(sx, sz);
    view.ox = (cw - (view.maxX - view.minX) * view.scale) / 2 - view.minX * view.scale;
    // z 正方向为北(上)：z 增大时屏幕 y 减小
    view.oz = ch / 2 + (view.minZ + view.maxZ) * view.scale / 2;
  }
  function wx(worldX) { return worldX * view.scale + view.ox; }
  function wz(worldZ) { return -worldZ * view.scale + view.oz; }
  function wxi(screenX) { return (screenX - view.ox) / view.scale; }
  function wzi(screenY) { return (view.oz - screenY) / view.scale; }

  // ---- colors ----
  const mobColors = {};
  function mobColor(name) {
    if (!name) return '#7cd47c';
    if (mobColors[name]) return mobColors[name];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    mobColors[name] = 'hsl(' + hue + ',70%,55%)';
    return mobColors[name];
  }

  // ---- logging ----
  function log(msg, cls) {
    const div = document.createElement('div');
    div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    if (cls) div.className = cls;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
    while (logBox.children.length > 80) logBox.removeChild(logBox.firstChild);
  }

  // ---- ws ----
  function connect() {
    const url = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/pt/ws';
    ws = new WebSocket(url);
    ws.onopen = () => {
      connStatus.textContent = 'CONNECTED'; connStatus.className = 'on'; log('connected', 'ok');
      // 断线重连：若持有 token 且之前在游戏中，自动重连
      if (reconnectToken && state.step === 'game') {
        log('auto reconnecting with token...');
        send('auth.reconnect', { token: reconnectToken });
      }
    };
    ws.onclose = () => {
      connStatus.textContent = 'DISCONNECTED'; connStatus.className = 'off'; log('disconnected', 'err');
      // 在游戏中且持有 token → 尝试自动重连
      if (reconnectToken && state.step === 'game') {
        scheduleReconnect();
      }
    };
    ws.onerror = () => log('ws error', 'err');
    ws.onmessage = (ev) => { try { handleMessage(JSON.parse(ev.data)); } catch (e) { log('bad msg: ' + e.message, 'err'); } };
  }
  function scheduleReconnect() {
    if (reconnectTimer) return;
    log('attempting reconnect in 3s...');
    reconnectTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) { clearInterval(reconnectTimer); reconnectTimer = null; return; }
      if (reconnectTimer && ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
      connect();
    }, 3000);
  }
  function send(type, data) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: type, data: data || {} })); }

  // ---- protocol ----
  function handleMessage(msg) {
    const t = msg.type, d = msg.data || {};
    switch (t) {
      case 'auth.loginResult':
        if (d.success) {
          state.step = 'server';
          state.accountId = d.accountId;
          log('login OK, accountId=' + d.accountId + ' → select server', 'ok');
          showLoginUi();
          // 服务器会自动下发 auth.serverList
        } else {
          log('login failed: ' + d.errorMessage, 'err');
        }
        break;
      case 'auth.serverList':
        state.servers = d.servers || [];
        renderServers();
        log('server list: ' + state.servers.map(s => s.name).join(', '));
        break;
      case 'auth.selectServer':
        if (d.success) {
          state.step = 'char';
          state.selectedServer = d.serverId != null ? d.serverId : 1;
          document.getElementById('serverBox').style.display = 'none';
          log('server selected (id=' + d.serverId + '), loading characters...', 'ok');
          // 主动拉取带属性的角色列表
          send('auth.characterList', {});
        } else {
          log('server select failed', 'err');
        }
        break;
      case 'auth.createCharacter':
        if (d.success) {
          log('character created: ' + d.name, 'ok');
          document.getElementById('createError').style.display = 'none';
          document.getElementById('newCharName').value = '';
          send('auth.characterList', {});
        } else {
          const err = document.getElementById('createError');
          err.textContent = 'Create failed: ' + (d.errorMessage || ('code ' + d.errorCode));
          err.style.display = 'block';
          log('create failed: ' + (d.errorMessage || d.errorCode), 'err');
        }
        break;
      case 'game.characterInfo':
        renderInfoDrawer(d);
        // 缓存服务端权威速度（单位/秒），客户端预测用同一公式
        if (typeof d.walkSpeed === 'number') state.player.walkSpeed = d.walkSpeed;
        if (typeof d.runSpeed === 'number') state.player.runSpeed = d.runSpeed;
        break;
      case 'reconnect.token':
        reconnectToken = d.token;
        log('reconnect token received');
        break;
      case 'auth.reconnected':
        if (d.success) {
          state.step = 'game';
          state.player = { x: d.x, z: d.z, hp: 100, maxHp: 100, mp: 50, maxMp: 50, level: 1 };
          state.mapId = d.mapId;
          log('reconnected to map ' + d.mapId + ' at (' + Math.round(d.x) + ',' + Math.round(d.z) + ')', 'ok');
          showGame();
          populateMaps();
        } else {
          log('reconnect failed', 'err');
        }
        break;
      case 'auth.logout':
        if (d.success) {
          reconnectToken = null;
          resetToLogin();
          log('logged out', 'ok');
        }
        break;
      case 'auth.characterList':
        state.characters = d.characters || [];
        renderChars();
        break;
      case 'auth.createResult':
        if (d.success) { log('character created', 'ok'); send('auth.selectServer', { serverId: state.selectedServer || 1 }); }
        else log('create failed code=' + d.errorCode, 'err');
        break;
      case 'auth.enterGame':
        log('enter game: char ' + d.playerId + ' lv' + d.level);
        state.player = { x: 0, z: 0, hp: d.hp, maxHp: d.maxHp, mp: d.mp, maxMp: d.maxMp, level: d.level };
        populateMaps();
        // 自动进入角色上次所在地图
        send('game.enterMap', { mapId: (state.selectedChar && state.selectedChar.mapId != null) ? state.selectedChar.mapId : 1 });
        break;
      case 'map.list':
        const sel = document.getElementById('mapSel');
        sel.innerHTML = '';
        (d.maps || []).forEach(m => {
          const o = document.createElement('option');
          o.value = m.mapId;
          o.textContent = m.name + ' (' + m.shortName + ')';
          sel.appendChild(o);
        });
        break;
      case 'game.mapEntered':
        state.mapId = d.mapId;
        state.mapName = d.mapName;
        state.spawnPoints = d.spawnPoints || [];
        state.mapConfig = d.config || null;
        state.player.x = d.player.x;
        state.player.z = d.player.z;
        state.bounds = computeBounds();
        log('entered map ' + d.mapId + ' [' + d.mapName + '] ' + state.spawnPoints.length + ' spawn points, max=' + (state.mapConfig.maxMonsters), 'ok');
        showGame();
        draw();
        updateStatus();
        if (Object.keys(state.mapAabbs).length === 0) send('map.aabbs');
        // 拉取权威速度（客户端预测用），确保 moveStep 速度与服务端一致
        send('game.characterInfo', {});
        break;
      case 'map.aabbs':
        state.mapAabbs = d.aabbs || {};
        preloadMapImages();
        draw();
        break;
      case 'game.mapSwitched':
        // 跨图：从 fromMapId 切到 mapId（坐标已更新），重新拉取新地图数据
        state.mapId = d.mapId;
        state.player.x = d.x;
        state.player.z = d.z;
        log('map switched ' + d.fromMapId + ' -> ' + d.mapId + ' at (' + Math.round(d.x) + ',' + Math.round(d.z) + ')', 'ok');
        draw();
        updateStatus();
        // 带当前坐标重新请求地图数据，避免被重置到出生点
        send('game.enterMap', { mapId: d.mapId, x: d.x, z: d.z });
        break;
      case 'game.moveAck':
        break;
      case 'game.snapshot':
        // 服务端权威位置：
        // - 静止 → 直接采用权威位置
        // - 移动中 → 只在漂移超过一个 tick 步进（速度发散）时轻微纠偏，
        //   否则信任客户端预测（与服务端同公式，时序抖动引起的微小漂移不拉回，避免抖卡）
        const px = d.player.x, pz = d.player.z;
        const drift = Math.hypot(px - state.player.x, pz - state.player.z);
        if (!moving) {
          state.player.x = px;
          state.player.z = pz;
        } else if (drift > 20) {
          state.player.x += (px - state.player.x) * 0.2;
          state.player.z += (pz - state.player.z) * 0.2;
        }
        state.player.hp = d.player.hp;
        state.player.maxHp = d.player.maxHp;
        state.player.mp = d.player.mp;
        state.player.maxMp = d.player.maxMp;
        state.player.level = d.player.level;
        state.monsters = d.monsters || [];
        state.otherPlayers = d.players || [];
        if (d.spawnPoints) state.spawnPoints = d.spawnPoints;
        draw();
        updateStatus();
        break;
      case 'game.allocateStat':
        if (d.success) {
          log('allocated ' + d.points + ' ' + d.stat + ' (pts left ' + d.statePoint + ')', 'ok');
          send('game.characterInfo', {});
        } else {
          log('allocate failed: not enough points', 'err');
        }
        break;
      case 'game.levelUp':
        log('LEVEL UP! now Lv ' + d.level + ' (state points ' + d.statePoint + ')', 'ok');
        if (!document.getElementById('infoDrawer').classList.contains('hidden')) {
          send('game.characterInfo', {});
        }
        break;
      case 'game.playerRespawn':
        log('You died! Respawned at map ' + d.mapId + ' (' + d.x + ',' + d.z + ') hp ' + d.hp, 'err');
        state.player.hp = d.hp;
        state.player.maxHp = state.player.maxHp;
        // 重新进入出生地图（带坐标，避免重置到出生点）
        send('game.enterMap', { mapId: d.mapId, x: d.x, z: d.z });
        break;
      case 'error':
        log('server error ' + d.code + ': ' + d.message, 'err');
        break;
      default:
        log('recv ' + t + ' ' + JSON.stringify(d).slice(0, 120));
    }
  }

  // ---- UI ----
  function showLobby() {
    document.getElementById('lobby').style.display = 'flex';
    document.getElementById('gameView').style.display = 'none';
  }
  function showGame() {
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('gameView').style.display = 'flex';
    resize();
  }
  function showLoginUi() {
    // 登录成功后进入选服阶段
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('serverBox').style.display = 'block';
    document.getElementById('charBox').style.display = 'none';
  }
  function resetToLogin() {
    state.step = 'login';
    state.accountId = null;
    state.servers = [];
    state.selectedServer = null;
    state.characters = [];
    state.selectedChar = null;
    state.mapId = null;
    state.spawnPoints = [];
    state.monsters = [];
    state.otherPlayers = [];
    state.bounds = null;
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('serverBox').style.display = 'none';
    document.getElementById('charBox').style.display = 'none';
    state.player = { x: 0, z: 0, hp: 100, maxHp: 100 };
    showLobby();
    draw();
  }
  function preloadMapImages() {
    // 预加载所有地图背景图（PNG 已在 static/spawn-debug/maps/，按 URL 直接加载）
    for (const mapId in state.mapAabbs) {

  // ---- drawing ----
  function draw() {
    computeView();
    ctx.clearRect(0, 0, cv.width, cv.height);

    // 血条：绿色=当前血，红色=已损失；宽度 = 图标直径 * 2
    function drawHpBar(x, y, cur, max, width) {
      const ratio = Math.max(0, Math.min(1, cur / (max > 0 ? max : 1)));
      const h = 3, bx = x - width / 2, by = y + 2;
      ctx.fillStyle = '#f85149';           // 损失部分（红）
      ctx.fillRect(bx, by, width, h);
      ctx.fillStyle = '#7cd47c';           // 当前血（绿）
      ctx.fillRect(bx, by, width * ratio, h);
    }

    // 地图背景（mesh PNG，按 AABB 定位；图在视野外则跳过）
    for (const mapId in state.mapAabbs) {
      const a = state.mapAabbs[mapId];
      const img = state.mapImages[mapId];
      if (!a || !img || !img.complete || img.naturalWidth === 0) continue;
      const sx1 = wx(a.xMin), szTop = wz(a.zMax);
      const sx2 = wx(a.xMax), szBottom = wz(a.zMin);
      // 视野外剔除
      if (sx2 < 0 || szBottom < 0 || sx1 > cv.width || szTop > cv.height) continue;
      ctx.drawImage(img, sx1, szTop, sx2 - sx1, szBottom - szTop);
    }

    // 全部地图 AABB 框（当前图高亮）
    for (const mapId in state.mapAabbs) {
      const a = state.mapAabbs[mapId];
      if (!a) continue;
      const x1 = wx(a.xMin), zTop = wz(a.zMax);
      const x2 = wx(a.xMax), zBottom = wz(a.zMin);
      if (x2 < 0 || zBottom < 0 || x1 > cv.width || zTop > cv.height) continue;
      const isCur = String(state.mapId) === mapId;
      ctx.strokeStyle = isCur ? 'rgba(255,212,121,0.8)' : 'rgba(157,184,217,0.35)';
      ctx.lineWidth = isCur ? 2 : 1;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(x1, zTop, x2 - x1, zBottom - zTop);
      ctx.setLineDash([]);
      ctx.font = '10px Consolas';
      ctx.fillStyle = isCur ? 'rgba(255,212,121,0.9)' : 'rgba(157,184,217,0.6)';
      ctx.fillText(a.name || ('Map ' + mapId), x1 + 4, zTop - 4);
    }

    // spawn points
    for (const sp of state.spawnPoints) {
      const x = wx(sp.x), z = wz(sp.z);
      ctx.beginPath();
      ctx.arc(x, z, 4, 0, Math.PI * 2);
      ctx.fillStyle = sp.active ? '#ff6b6b' : '#555';
      ctx.fill();
      if (sp.active && sp.monsterCount != null) {
        ctx.font = '9px Consolas';
        ctx.fillStyle = '#ff6b6b';
        ctx.fillText(sp.monsterCount + '/' + sp.maxMonsters, x + 5, z - 5);
      }
    }

    // monsters
    for (const m of state.monsters) {
      const x = wx(m.x), z = wz(m.z);
      let color;
      if (m.state === 'CHASE' || m.state === 'ATTACK') color = '#ffd479';
      else if (m.hp > 0 && m.hp < m.maxHp * 0.3) color = '#f85149';
      else color = mobColor(m.name);
      ctx.beginPath();
      ctx.arc(x, z, 6, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (m.targetPlayerId != null) {
        ctx.beginPath();
        ctx.arc(x, z, 9, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffd479';
        ctx.stroke();
      }
      // 顶部：等级 + 名字（居中）
      ctx.font = '9px Consolas';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.fillText('Lv' + m.level + ' ' + m.name, x, z - 9);
      ctx.textAlign = 'left';
      // 底部：血条（直径 12 × 2 = 24）
      drawHpBar(x, z, m.hp, m.maxHp, 24);
    }

    // other players
    for (const op of state.otherPlayers) {
      const x = wx(op.x), z = wz(op.z);
      ctx.beginPath();
      ctx.arc(x, z, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#c7a5ff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, z, 12, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(199,165,255,0.5)';
      ctx.stroke();
      ctx.font = '10px Consolas';
      ctx.fillStyle = '#c7a5ff';
      ctx.fillText(op.name, x + 12, z + 4);
    }

    // player
    const px = wx(state.player.x), pz = wz(state.player.z);
    ctx.beginPath();
    ctx.arc(px, pz, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#4dabff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, pz, 12, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(77,171,255,0.5)';
    ctx.stroke();
    ctx.font = '10px Consolas';
    ctx.fillStyle = '#4dabff';
    ctx.fillText('YOU', px + 12, pz + 4);
    // 玩家血条（直径 16 × 2 = 32）
    drawHpBar(px, pz, state.player.hp, state.player.maxHp, 32);

    // 攻击目标高亮
    if (attackTargetId != null) {
      const tm = findMonster(attackTargetId);
      if (tm) {
        const tx = wx(tm.x), tz = wz(tm.z);
        ctx.beginPath();
        ctx.arc(tx, tz, 14, 0, Math.PI * 2);
        ctx.strokeStyle = '#ff4d4d';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

  // ---- canvas resize ----
  function resize() {
    const area = document.getElementById('maparea');
    const w = Math.max(200, area.clientWidth);
    const h = Math.max(200, area.clientHeight);
    cv.width = w;
    cv.height = h;

  window.addEventListener('resize', resize);
  resize();

  // ---- move & attack ----
  let running = true;
  window.addEventListener('keydown', (e) => { if (e.key === 'Shift') running = false; });
  window.addEventListener('keyup', (e) => { if (e.key === 'Shift') running = true; });
  const ATTACK_RANGE = 150; // 攻击距离（游戏单位）
  const ATTACK_INTERVAL = 1000; // 攻击间隔（毫秒）
  let moveTarget = null;   // {x, z}
  let moving = false;
  let moveTimer = null;
  let attackTargetId = null; // 当前攻击目标怪物 id
  let attackTimer = null;

  function dist2D(ax, az, bx, bz) {
    const dx = bx - ax, dz = bz - az;
    return Math.sqrt(dx * dx + dz * dz);
  }
  function findMonster(id) {
    return (state.monsters || []).find(m => m.id === id);
  }

  // 点击：命中怪物则设为攻击目标并追击；点空地则移动（取消攻击）
  cv.addEventListener('mousedown', (e) => {
    if (state.mapId == null) return;
    const rect = cv.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (cv.width / rect.width);
    const sy = (e.clientY - rect.top) * (cv.height / rect.height);
    const wp = { x: wxi(sx), z: wzi(sy) };
    // 找最近怪物（屏幕距离 < 12px 视为点击到它）
    let hit = null, hitDist = 12;
    for (const m of (state.monsters || [])) {
      const mxs = wx(m.x), mzs = wz(m.z);
      const d = Math.sqrt((mxs - sx) * (mxs - sx) + (mzs - sy) * (mzs - sy));
      if (d < hitDist) { hitDist = d; hit = m; }
    }
    if (hit) {
      attackTargetId = hit.id;
      moveTarget = { x: hit.x, z: hit.z };
    } else {
      stopAttack();
      attackTargetId = null;
      moveTarget = wp;
    }
    moving = true;
    if (!moveTimer) moveTimer = setInterval(moveStep, 50);
  });
  cv.addEventListener('wheel', (e) => {
    if (state.mapId == null) return;
    e.preventDefault();
    viewSpan *= (e.deltaY > 0) ? 1.25 : 0.8;
    viewSpan = Math.max(200, Math.min(8000, viewSpan));
    draw();
    updateStatus();
  }, { passive: false });
  window.addEventListener('mousemove', (e) => {
    // 追击怪物时不覆盖移动目标
    if (moving && attackTargetId == null && e.buttons & 1) moveTarget = screenToWorld(e);
  });
  // 攻击目标模式下松开/离开鼠标不中断追击与攻击
  window.addEventListener('mouseup', () => { if (attackTargetId == null) stopMove(); });
  window.addEventListener('mouseleave', () => { if (attackTargetId == null) stopMove(); });

  function screenToWorld(e) {
    const rect = cv.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (cv.width / rect.width);
    const sy = (e.clientY - rect.top) * (cv.height / rect.height);
    return { x: wxi(sx), z: wzi(sy) };
  }
  function stopMove() {
    moving = false;
    if (moveTimer) { clearInterval(moveTimer); moveTimer = null; }
    // 通知服务端停止移动
    send('game.moveStop', {});
  }
  function stopAttack() {
    if (attackTimer) { clearInterval(attackTimer); attackTimer = null; }
  }
  function startAttack(monster) {
    stopAttack();
    const tick = () => {
      const m = findMonster(attackTargetId);
      if (attackTargetId == null || !m || m.hp <= 0) {
        attackTargetId = null;
        stopAttack();
        return;
      }
      // 目标跑出范围 → 重新追击
      if (dist2D(state.player.x, state.player.z, m.x, m.z) > ATTACK_RANGE) {
        stopAttack();
        moving = true;
        moveTarget = { x: m.x, z: m.z };
        if (!moveTimer) moveTimer = setInterval(moveStep, 50);
        return;
      }
      send('game.attack', { targetId: attackTargetId });
    };
    tick(); // 立即攻击
    attackTimer = setInterval(tick, ATTACK_INTERVAL);
  }
  function moveStep() {
    if (!moving) { stopMove(); return; }
    // 有攻击目标：追踪怪物，进入攻击范围后停下开打
    if (attackTargetId != null) {
      const m = findMonster(attackTargetId);
      if (!m || m.hp <= 0) { attackTargetId = null; stopMove(); return; }
      if (dist2D(state.player.x, state.player.z, m.x, m.z) <= ATTACK_RANGE) {
        stopMove();
        startAttack(m);
        return;
      }
      moveTarget = { x: m.x, z: m.z }; // 持续追踪
    }
    if (!moveTarget) { stopMove(); return; }
    const p = state.player;
    const dx = moveTarget.x - p.x, dz = moveTarget.z - p.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 1) { stopMove(); return; }

    // 计算移动方向角（弧度，0=Z+方向，与服务端 atan2(dx,dz) 一致）
    const angle = Math.atan2(dx, dz);

    // 上报移动意图（方向+奔跑），服务端权威计算位置
    send('game.moveInput', { angle: angle, running: running });

    // 客户端预测：用同一速度公式推算本地位置（与服务端一致）
    const speed = running ? (p.runSpeed || 310) : (p.walkSpeed || 112);
    const step = Math.min(speed * 0.05, dist);
    const r = step / dist;
    state.player.x = p.x + dx * r;
    state.player.z = p.z + dz * r;
    draw();
    updateStatus();
  }

  };
  document.getElementById('btnCreate').onclick = () => {
    const name = document.getElementById('newCharName').value.trim();
    if (!name) { log('enter a character name', 'err'); return; }
    const head = (HEAD_FILES[newCharClass] || [])[newCharHead] || '';
    send('auth.createCharacter', { name: name, classId: newCharClass, head: head });
  };
  document.getElementById('btnCloseInfo').onclick = () => {
    document.getElementById('infoDrawer').classList.add('hidden');
  };

  // auto connect on load
  connect();
})();
</script>
</body>
</html>
