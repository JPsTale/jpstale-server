# 公共配置（所有 profile 共享）
server:
  port: ${PT_WEB_PORT:8080}
  servlet:
    context-path: ${PT_WEB_CONTEXT_PATH:/pt}

spring:
  application:
    name: pt-web-server
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    port: 6379
    database: 0
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

sa-token:
  token-name: satoken
  timeout: 86400
  is-concurrent: true
  is-share: false
