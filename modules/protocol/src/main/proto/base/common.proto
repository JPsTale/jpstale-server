syntax = "proto3";
package jpt.base;
option java_package = "org.jpstale.server.proto.base";
option java_outer_classname = "CommonProto";

// 位置
message Position {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 向量
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 错误码
enum ErrorCode {
  SUCCESS = 0;
  UNKNOWN_ERROR = 1;
  NOT_LOGIN = 2;
  ALREADY_LOGIN = 3;
  INVALID_PASSWORD = 4;
  ACCOUNT_BANNED = 5;
  CHARACTER_NOT_FOUND = 6;
  CHARACTER_LIMIT = 7;
  INVALID_MAP = 8;
  POSITION_INVALID = 9;
  SPEED_HACK = 10;
  TELEPORT_HACK = 11;
  INVINCIBLE_HACK = 12;
  INVALID_NAME = 13;
  NAME_EXISTS = 14;
  PARTY_ERROR = 15;
  ATTR_ERROR = 16;
}

// 物品类型
enum ItemType {
  WEAPON = 0;
  ARMOR = 1;
  ACCESSORY = 2;
  CONSUMABLE = 3;
  MATERIAL = 4;
  QUEST = 5;
}

// 怪物状态
enum MonsterState {
  MONSTER_IDLE = 0;
  MONSTER_PATROL = 1;
  MONSTER_CHASE = 2;
  MONSTER_ATTACK = 3;
  MONSTER_RETURN = 4;
  MONSTER_DEAD = 5;
}

// 玩家状态
enum PlayerState {
  PLAYER_ALIVE = 0;
  PLAYER_DEAD = 1;
  PLAYER_SITTING = 2;
}

// 聊天频道
enum ChatChannel {
  CHAT_WORLD = 0;
  CHAT_MAP = 1;
  CHAT_PARTY = 2;
  CHAT_GUILD = 3;
  CHAT_PRIVATE = 4;
  CHAT_SYSTEM = 5;
  CHAT_TRADE = 6;
  // 战斗日志（受击/击杀/经验）：**从系统频道分出来**，战斗刷屏不再吃掉系统消息的注意力。
  // 走 S2C_SystemMessage.channel 投递；未显式设置该字段的一律按系统消息处理。
  CHAT_BATTLE = 7;
}

// 技能类型
enum SkillType {
  SKILL_PHYSICAL_ATTACK = 0;
  SKILL_MAGIC_ATTACK = 1;
  SKILL_HEAL = 2;
  SKILL_BUFF = 3;
  SKILL_AOE = 4;
}

// 装备槽位
enum EquipmentSlotType {
  EQUIP_WEAPON = 0;
  EQUIP_HEAD = 1;
  EQUIP_BODY = 2;
  EQUIP_LEGS = 3;
  EQUIP_FEET = 4;
  EQUIP_HANDS = 5;
  EQUIP_ACCESSORY = 6;
  EQUIP_RING = 7;
  EQUIP_NECKLACE = 8;
}

// 物品实例（一物一行，对应 userdb.item）
// location/slot 语义（画布版）：
//   0=背包 12×12 slot=y*12+x(0~143)；1=仓库 9×9 slot=y*9+x(0~80)；
//   2=装备槽(1~13)；6=备用武器槽(1/2)。
message ItemProto {
  int64 uid = 1;            // 物品实例唯一 id（userdb.item.id）
  int32 itemlist_id = 2;    // 定义主键（gamedb.itemlist.id）
  int32 item_code = 3;      // 原版物品码（客户端动画/图标查表）
  int32 location = 4;
  int32 slot = 5;
  int32 count = 6;
  // 掷点实例值（无随机属性的消耗/材料可为 0/不填）
  int32 durability = 7;
  int32 durability_max = 8;
  int32 damage_min = 9;
  int32 damage_max = 10;
  int32 attack_rating = 11;
  int32 defence = 12;
  int32 block_rating = 13;  // 0.1 精度（如 5.0 → 50）
  int32 absorb = 14;        // 0.1 精度
  int32 speed = 15;         // 0.1 精度
  int32 res_bionic = 16;
  int32 res_fire = 17;
  int32 res_ice = 18;
  int32 res_lighting = 19;
  int32 res_poison = 20;
  int32 increase_life = 21;
  int32 increase_mana = 22;
  int32 increase_stamina = 23;
  int32 req_level = 24;
  int32 req_strength = 25;
  int32 req_spirit = 26;
  int32 req_talent = 27;
  int32 req_agility = 28;
  int32 req_health = 29;
  int32 price = 30;
  int32 job_code_mask = 31;
  int32 aging_level = 32;   // 锻造等级（本轮存储，操作逻辑未实现）
  int32 critical = 33;      // 必杀
  int32 range = 34;         // 射程（远程武器）
  int32 attack_speed = 35;  // 攻击速度（近战/法杖）
  // 8 系抗性补齐（16~20 为其中 5 系）
  int32 res_earth = 36;     // 自然
  int32 res_water = 37;
  int32 res_wind = 38;
  // 装备的**每秒回复**（实例值，0.1 精度：15 = 1.5/秒）。
  // ⚠ 不是药水恢复：药水恢复是**模板**列 `itemlist.recovery*`，服务端使用时才读
  // （客户端显示走 `potion-effects.generated.json`）。这里三个是 `userdb.item` 的掷点实例列，
  // 由 `EquipSummary.regenHp/Mp/Stm` 累加、`PlayerStatCalculator` 计入面板每秒回复。
  int32 mana_regen = 39;
  int32 life_regen = 40;
  int32 stamina_regen = 41;
  // ---- 职业特效（sITEM_SPECIAL / userdb.item.spec_*，0.1 精度同前缀规则）----
  int32 spec_absorb = 42;           // 0.1 精度
  int32 spec_defence = 43;
  int32 spec_speed = 44;            // 0.1 精度
  int32 spec_block_rating = 45;     // 0.1 精度
  int32 spec_attack_speed = 46;
  int32 spec_critical = 47;
  int32 spec_shooting_range = 48;
  int32 spec_magic_mastery = 49;    // 0.1 精度
  int32 spec_res_bionic = 50;
  int32 spec_res_earth = 51;
  int32 spec_res_fire = 52;
  int32 spec_res_ice = 53;
  int32 spec_res_lighting = 54;
  int32 spec_res_poison = 55;
  int32 spec_res_water = 56;
  int32 spec_res_wind = 57;
  // 每级加成（Lv/N）
  int32 spec_lev_mana = 58;
  int32 spec_lev_life = 59;
  int32 spec_lev_attack_rating = 60;
  int32 spec_lev_damage_max = 61;
  // 每级属性攻击（Lv/N）
  int32 spec_lev_res_bionic = 62;
  int32 spec_lev_res_earth = 63;
  int32 spec_lev_res_fire = 64;
  int32 spec_lev_res_ice = 65;
  int32 spec_lev_res_lighting = 66;
  int32 spec_lev_res_poison = 67;
  int32 spec_lev_res_water = 68;
  int32 spec_lev_res_wind = 69;
  // 每级再生（百分比）
  int32 spec_per_mana_regen = 70;    // 0.01 精度
  int32 spec_per_life_regen = 71;
  int32 spec_per_stamina_regen = 72;

  // ---- 锻造 / 合成状态（原版 ItemKindCode / ItemKindMask / ItemAgingNum[1] / ItemAgingProtect[0]）----
  // 依据：PristonTale-EU `Server/server/MixHandler.cpp` / `AgeHandler.cpp`，见
  // docs/锻造与合成-源码分析.md §3.13 与 docs/锻造与合成-我们的实现方案.md §2。
  //   1 = ITEM_KIND_CRAFT（合成物）、2 = ITEM_KIND_AGING…（0 = 普通物品）
  int32 kind_code = 73;
  // 效果**位掩码**（原版 `eMixEffect` / `ItemKindMask`）：合成时"效果类型值就是掩码位"，
  // 客户端据此给"被强化过的那几行"上色（管理端 `mod-mix` 紫）。
  int32 craft_mask = 74;
  // 合成**配方 id**（`gamedb.mixlist.mixuniqueid`；原版记在 `sMixUniqueID1`）。
  // 我们的库没有那一列，借用 `userdb.item.aging_num2` 存（见实现方案 §2.2）——
  // 用途：客户端显示配方名/配色；服务端反查配方数值（如"药水槽容量"那位实例没有字段）。
  int32 mix_unique_id = 75;
  // 合成/锻造的**校验和**（原版 `ItemAgingProtect[0]`，反外挂比对用；客户端只读不写）
  int32 aging_protect = 76;
  // 锻造**熟练度进度**（原版 `ItemAgingCount[0]/[1]`，EU 里叫 `sMatureBar` 的 cur/max）——
  // 客户端信息框用它画进度条（原版 `AgingBarLenght = 125 * cur/max`，见 `sinItem.cpp:2226-2239`）
  int32 aging_exp = 77;
  int32 aging_exp_max = 78;
  // 合成配方的**效果清单**（位对应的文案 key + 配方值 + 是不是直加）——
  // **只发数据不发文案**（用户 2026-09-22："合成配方名理应支持 i18n，后端下发名字不合适"）：
  // 客户端用 `t(key)` 查自己的 `mixe.*` 词条拼出显示名，zh/en 自动。
  repeated MixEffectProto mix_effects = 79;
}

// 地面物品
message GroundItemProto {
  int64 ground_item_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
  Position position = 4;
  int64 owner_id = 5;
  int64 expire_time = 6;
  string name = 7;
  // 地面掉落模型码 → 资产 dropitem/it{code}.smd。普通物品取 itemlist.codeImg1（如 "WS111"）；
  // **金币家族**（原版 sinGG1）取 codeImg2（"DRCOIN" —— 资产 itdrcoin.smd 存在，而 codeImg1 的
  // "GG101" 没有对应模型，取错会让客户端 404 回落到旗帜）。
  string dorp_item = 8;
  // **金币金额**（仅金币家族的地面物 >0）：拾取时入账用；地面物只在内存里，不进 DB。
  int64 money = 9;
}

// Buff效果
message BuffEffectProto {
  string type = 1;
  int32 value = 2;
}

// Buff
message BuffProto {
  int64 buff_id = 1;
  int32 skill_id = 2;
  int64 caster_id = 3;
  int32 duration = 4;
  repeated BuffEffectProto effects = 5;
  int64 apply_time = 6;
}

// 朝向/方向角（对应 PT ax/ay/az）
message Rotation {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 角色外观——渲染一个角色所需的最小外观信息（角色选择列表、世界中其他玩家共用）
message CharacterAppearance {
  int32 class_id  = 1;  // 职业(1-10)，决定骨骼/身体前缀/头前缀/种族
  int32 head      = 2;  // 头型/头模型编号(0-2)，配合 rank 决定头模型（PT 无独立 face 字段，脸型即头模型名编号）
  int32 rank      = 3;  // 转职阶级(0-7)，决定头模型后缀(a/b/c)
  string body_model = 4;  // 身体模型 dorpItem（如 "da115"），时装查 COSTUME_BODY_MAP
  int32 body_model_idcode = 5;  // 身体模型 idcode（如 33623808），普通防具算 armorNum
  string weapon_dorp = 6; // 武器 dorpItem（可空，如 "WA102"）
  int32 weapon_idcode = 7; // 武器 idcode（如 0x010A0000），动画匹配按武器类型
  int32 weapon_pos  = 8;  // 武器挂点 modelPosition（2左/4右/0无）
  int32 size_level  = 9;  // 体型缩放（默认 1）
  string off_hand_dorp = 10; // 副手 dorpItem（盾 ds*/匕首 WD*/ws*；念珠 om* 不挂载故为空）
  int32 off_hand_idcode = 11; // 副手 idcode
  int32 off_hand_kind = 12;  // 副手类型：0=无 1=盾 2=匕首/武器
  int32 off_hand_pos  = 13;  // 副手挂点（2=左）
  // ── 锻造/合成呼吸发光的输入（原版 `sinSetCharItem` 用的那两列）──
  // 客户端据此查色表（`src/game/agingBlink.ts`：等级 → 行 → 呼吸光颜色 + 第二通道叠加贴图）。
  // **服务端不持有色表**（只在客户端一份），这里只发原始事实：
  int32 weapon_kind_code      = 14; // 主手原版 ItemKindCode：1=合成物 2=锻造物（0=普通/不发光）
  int32 weapon_aging_level    = 15; // 主手原版 ItemAgingNum[0]：锻造等级（合成物则是"材料槽+1"）
  int32 off_hand_kind_code    = 16; // 副手同上（没有副手件时为 0）
  int32 off_hand_aging_level  = 17; // 副手同上
}

// 玩家出现：外观 + 身份 + 位置 + 朝向 + 状态（对应 PT smTRNAS_PLAYERINFO）
message PlayerAppearInfo {
  int64 player_id         = 1;
  string name             = 2;
  int32 level             = 3;
  CharacterAppearance appearance = 4;
  Position position       = 5;
  Rotation rotation       = 6;
  int32 state             = 7;
  int32 hp = 8;
  int32 max_hp = 9;
}

// 合成配方里的一条效果（用于客户端拼配方显示名；key 形如 `mixe.defence`）
message MixEffectProto {
  string key = 1;      // 文案 key（服务端 `MixEffect.keyOf(bit)`）
  double value = 2;    // 配方里的值（与实例同单位）
  bool flat = 3;       // true=数值直加 / false=按当前值百分比
}
