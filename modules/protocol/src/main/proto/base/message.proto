syntax = "proto3";
package jpt.base;
option java_package = "org.jpstale.server.proto.base";
option java_outer_classname = "MessageProto";
// 逐条消息各生成一个顶层类（而非全塞进 MessageProto 的嵌套类）：
// 默认 false 时 95 条消息会生成单个 3.3MB 的 MessageProto.java，超过 IDEA
// 的 idea.max.intellisense.filesize 阈值（2.5MB）导致整个类在 IDE 里无法解析。
option java_multiple_files = true;

import "base/common.proto";

// ==================== 客户端 -> 服务端 ====================

// 客户端消息封装
message ClientMessage {
  oneof payload {
    // 认证 (100-199)
    C2S_LoginRequest login_request = 100;
    C2S_CreateCharacter create_character = 101;
    C2S_SelectCharacter select_character = 102;
    C2S_Logout logout = 103;
    C2S_BackToCharacterSelect back_to_character_select = 104;
    
    // 玩家 (200-299)
    C2S_PlayerMove player_move = 200;
    C2S_PlayerAction player_action = 201;
    C2S_UseItem use_item = 202;
    C2S_PickupItem pickup_item = 203;
    C2S_DropItem drop_item = 204;
    C2S_AllocateStat allocate_stat = 205;
    C2S_InventoryMove inventory_move = 206;
    C2S_EquipItem equip_item = 207;
    C2S_UnequipItem unequip_item = 208;
    C2S_SwitchWeapon switch_weapon = 209;
    C2S_BagLayout bag_layout = 210;
    C2S_StackMerge stack_merge = 211;
    C2S_Unstuck unstuck = 212;           // 脱困请求：服务端算落点（本图最近 StartPoint）并广播传送
    C2S_TakeToHand take_to_hand = 213;   // 拿起：把物品移到"鼠标位"（装备栏 slot=-1），原容器腾空
    C2S_BagSwap bag_swap = 214;           // **换手**：手上那件 ↔ 背包里某件（原子互换）
    C2S_NpcInteract npc_interact = 215;   // 点击 NPC（开对话/开商店）；服务端按 npc_id 找**本图最近的那个实例**做距离校验
    C2S_ShopBuy shop_buy = 216;           // 买入（服务端权威：校验距离/金币/背包，全部通过才扣钱发货）
    C2S_ShopSell shop_sell = 217;         // 卖出（原版是"点 Sell 后点自己背包里的物品"，不是拖拽）
    C2S_MixItem mix_item = 218;           // 合成：目标装备 + 材料石（服务端匹配 gamedb.mixlist 配方）
    C2S_AgeItem age_item = 219;           // 锻造投石：目标装备 + 一颗材料石（"一键拉满"走 use_item，不经此消息）
    C2S_ForceOrbItem force_orb_item = 220;
  C2S_MixPreview mix_preview = 221; // 力量大师转化：材料石 → 同档力量石
    C2S_LearnSkill learn_skill = 222;               // 学/升级技能（服务端权威：判定 + 扣钱 + 写技能等级）
    C2S_ResetSkillPoints reset_skill_points = 223;  // 洗点（会话内一次；守卫是内存标记，不落库）
    C2S_SetSkillBinding set_skill_binding = 224;    // 改技能绑定（拳位/快捷栏）；服务端校验后写 props 并回推 S2C_SkillBindings
    C2S_SkillHit skill_hit = 226;                   // 技能事件帧回报（逐段结算；D7）
    

    // 战斗 (300-399)
    C2S_Attack attack = 300;
    C2S_UseSkill use_skill = 301;
    C2S_AttackStart attack_start = 302;  // 起手（挥拳开始）
    C2S_AttackHit attack_hit = 303;      // 命中帧（每段一次）
    C2S_RespawnChoice respawn_choice = 304;  // 死亡后的复活选择（见该消息注释）
    
    // 社交 (400-499)
    C2S_Chat chat = 400;
    C2S_TradeRequest trade_request = 401;
    C2S_TradeAccept trade_accept = 402;
    C2S_TradeAddItem trade_add_item = 403;
    C2S_TradeConfirm trade_confirm = 404;
    C2S_PartyInvite party_invite = 405;
    C2S_PartyAccept party_accept = 406;
    C2S_PartyLeave party_leave = 407;
    
    // 心跳 (900-999)
    C2S_Ping ping = 900;
  }
}

// 服务端消息封装
message ServerMessage {
  oneof payload {
    // 认证 (100-199)
    S2C_LoginResponse login_response = 100;
    S2C_CharacterList character_list = 101;
    S2C_CreateCharacterResult create_character_result = 102;
    
    // 玩家 (200-299)
    S2C_PlayerAppear player_appear = 200;
    S2C_PlayerDisappear player_disappear = 201;
    S2C_PlayerMove player_move = 202;
    S2C_PlayerState player_state = 203;
    S2C_PlayerDeath player_death = 204;
    S2C_PlayerRespawn player_respawn = 205;
    S2C_EnterGame enter_game = 206;
    S2C_CharacterStatus character_status = 207;
    S2C_AppearanceUpdate appearance_update = 208;
    S2C_MapSwitched map_switched = 210;
    S2C_PlayerTeleport player_teleport = 209;  // 不连续位移（脱困/传送）：本人据此搬自己，旁观者据此挪 actor
    S2C_LevelUpBroadcast level_up_broadcast = 211;  // 升级广播：本人+观察者都收（本人播音+特效、观察者播特效）
    S2C_SkillList skill_list = 212;  // 已学技能表 + 两个技能点池（**只发本人**：技能点是私有的）
    S2C_SkillBindings skill_bindings = 213;  // 技能绑定表（拳位/快捷栏；**只发本人**）—— 与技能表同一批时机下发
    S2C_SkillStart skill_start = 214;        // 技能起手广播（旁观者播同一条技能动画）
    
    // 怪物 (300-399)
    S2C_MonsterAppear monster_appear = 300;
    S2C_MonsterDisappear monster_disappear = 301;
    S2C_MonsterMove monster_move = 302;
    S2C_MonsterState monster_state = 303;
    S2C_MonsterDeath monster_death = 304;

    // NPC (350-359)
    S2C_NpcAppear npc_appear = 350;
    S2C_NpcDisappear npc_disappear = 351;
    S2C_ShopOpen shop_open = 352;         // 打开商店：商品清单（含价格）；买/卖结果复用既有的 ItemUpdate/GoldChange 推送
    S2C_BuffState buff_state = 911;
  S2C_CraftOpen craft_open = 912;
  S2C_MixPreview mix_preview = 913;
  S2C_AgeUpBroadcast age_up_broadcast = 914;      // 生效中的 buff（力量石…）：服务端权威，客户端只显示倒计时
    
    // 战斗 (400-499)
    S2C_AttackResult attack_result = 400;
    S2C_SkillAttack skill_attack = 401;
    S2C_Damage damage = 403;
    S2C_Recovery recovery = 404;   // 资源回复广播（HP/MP）。**不是 heal** —— 回魔也叫它
    S2C_BuffApply buff_apply = 405;
    S2C_BuffRemove buff_remove = 406;
    S2C_AttackStart attack_start = 407;  // 起手广播（旁观者立刻挥拳）
    S2C_AttackPlan attack_plan = 408;     // 攻击计划：起手即裁定各段结果（B 方案）
    
    // 物品 (500-599)
    S2C_InventorySnapshot inventory_snapshot = 500;
    S2C_ItemUpdate item_update = 501;
    S2C_ItemRemove item_remove = 502;
    S2C_ItemUse item_use = 503;
    S2C_GoldChange gold_change = 504;
    S2C_GroundItemAppear ground_item_appear = 505;
    S2C_GroundItemDisappear ground_item_disappear = 506;
    S2C_ItemRemovedUids item_removed_uids = 507;
    
    // 社交 (600-699)
    S2C_Chat chat = 600;
    S2C_TradeRequest trade_request = 601;
    S2C_TradeOpen trade_open = 602;
    S2C_TradeUpdate trade_update = 603;
    S2C_TradeComplete trade_complete = 604;
    S2C_PartyUpdate party_update = 605;
    S2C_PartyInvite party_invite = 606;
    
    // 系统 (900-999)
    S2C_Pong pong = 900;
    S2C_Error error = 901;
    S2C_SystemMessage system_message = 902;
    S2C_Disconnect disconnect = 903;
    // 传输层信封（910，非游戏消息）：同一 tick 内发给该玩家的多条消息装成一个包
    S2C_Batch batch = 910;
  }
}

/**
 * 传输层合批信封（服务端 → 客户端）。
 *
 * 存在理由：服务端主循环每 tick(20Hz) 会产生大量"逐条 send"的小消息（怪物移动、玩家移动、
 * 伤害、聊天广播…）。原来每条消息各自编码、各自写一次 channel（= 一个 WS 帧），玩家一多、
 * 怪一多就变成"同一份数据被编码 N 次、发送 N 次"。现在同一 tick 内发给**同一个玩家**的消息
 * 先入队，tick 末尾一次编码、一次 writeAndFlush。
 *
 * 约束：
 *  - **只有服务端构造**，且**只包一层**（batch 里不会再套 batch）。
 *  - 客户端收到后逐条派发到各自的处理路径 —— 下游（bridge/WorldView）完全不知道合批的存在，
 *    行为与逐条发送一模一样。
 *  - 少数"必须立刻发"的消息不走信封（pong 要算 RTT、登录/选角/建角是请求-响应、disconnect 不能等），
 *    见 `PlayerSession.isImmediate`。
 */
message S2C_Batch {
  repeated ServerMessage messages = 1;
}

// ==================== 认证消息 (100-199) ====================

message C2S_LoginRequest {
  string username = 1;
  string password = 2;
  string client_version = 3;
}

message C2S_CreateCharacter {
  string name = 1;
  int32 class_id = 2;
  int32 head = 3;  // 创建时选的头型/头模型编号(0-2)
}

message C2S_SelectCharacter {
  int64 character_id = 1;
}

message C2S_Logout {
}

// 游戏内退出到角色选择界面（保留账号会话，仅清除角色绑定）
message C2S_BackToCharacterSelect {
}

message S2C_LoginResponse {
  bool success = 1;
  int64 account_id = 2;
  ErrorCode error_code = 3;
  string error_message = 4;
}

// 地图静态信息：随进入游戏下发，客户端本地换图时查安全区（动画区域位）
message MapInfo {
  int32 map_id = 1;
  // true=安全区（村庄，禁战斗姿态/自动收武器动画）；false=战斗区域
  bool is_safe = 2;
  // 进入该图所需等级（gamedb.maplist.levelreq 原样下发；0=无门槛，>=150=未开放）。
  // 客户端用它**本地拦截跨图边界**（服务端另有同一判定的权威校验 MapManager.canEnter）。
  int32 level_req = 3;
  // 世界坐标包围盒（SMD 派生，efria-studio map-bounds 生成、fields.json 权威）。
  // 客户端判图/预加载的逐帧查找表——替代原先「进图下载全部 SMD 取 bounds」的 334MB 隐藏预取。
  float min_x = 4;
  float max_x = 5;
  float min_z = 6;
  float max_z = 7;
}

message S2C_CharacterList {
  repeated CharacterInfo characters = 1;
}

message CharacterInfo {
  int64 character_id = 1;
  string name = 2;
  int32 class_id = 3;
  int32 level = 4;
  Position position = 5;
  int32 map_id = 6;
  CharacterAppearance appearance = 7;  // 角色外观（职业/头/转职/身体/武器），服务端已算好
}

message S2C_CreateCharacterResult {
  bool success = 1;
  int64 character_id = 2;
  ErrorCode error_code = 3;
}

// ==================== 玩家消息 (200-299) ====================

message C2S_PlayerMove {
  Position position = 1;  // 客户端权威位置（world float）；服务端限速/穿墙校验后广播
  float angle = 2;        // 移动方向弧度（0=+Z 北，atan2(dx,dz)）
  int32 mode = 3;         // 0=IDLE 1=WALK 2=RUN（PlayerMoveMode）
  int64 timestamp = 4;    // 客户端本地时间(ms)
  int32 anim_state = 5;   // 动画状态覆盖（0=按 mode 推导 STAND/WALK/RUN；掉落时上报
                          // FALLDOWN=0x70/FALLSTAND=0x71/FALLDAMAGE=0x72，服务端原样广播）
  // 「动画状态」只说明**播哪一类**（站/走/跑…），同一类下还有多个变体。变体原先由各客户端各自
  // 随机选 → 同一个角色在别人屏幕上播的是另一条。故**上报自己正播的那一条**，服务端原样透传，
  // 旁观者直接播同一条（不再各自匹配）。0/空 = 未提供 → 旁观者回退本地匹配并上报降级。
  int32 anim_index = 6;   // 动画条目索引（.inx 条目号）—— 跨端播放的依据
  string anim_clip = 7;   // 同一条的语义 ID（如 stand_unarmed.m4.10）—— 校验两端数据是否同代
}

message C2S_PlayerAction {
  int32 action_type = 1;
  int64 target_id = 2;
}

// 使用物品（药水快捷/右键，uid 定位可堆叠物）
message C2S_UseItem {
  int64 uid = 1;
  int32 quantity = 2;
}

message C2S_PickupItem {
  int64 ground_item_id = 1;
  // 拾取后是否**直接拿到手上**（鼠标位）。对应原版：背包窗口**开着**时拾取物 `memcpy` 进 `MouseItem`
  // （不需要背包空格）；关着时走 `AutoSetInvenItem` 自动进背包空格。手位被占则仍进背包（不覆盖手上那件）。
  bool to_hand = 2;
}

// 丢弃物品（软删；count=丢弃堆叠数，装备恒 1）
message C2S_DropItem {
  int64 uid = 1;
  int32 count = 2;
}

// 拿起（任意容器 → 手持位）。**没有配套的"放下"消息**：放下就是把它放到某个去处，
// 复用已有的 EquipItem（装备槽/药水槽）、BagLayout（背包页/仓库格）、DropItem（地面）。
// 拿起要单独一条消息，是因为"在手上"是一个真实位置（location = ItemLocations.HELD = -1）：
// 服务端据此把物品移出原容器、立刻重算属性/外观，并在断线重连后原样恢复"手上还拿着它"。
message C2S_TakeToHand {
  int64 uid = 1;
  // **拆分拿起**（用户 2026-09-14）：只拿 `count` 个到鼠标位，余数留在原格。
  // 0 / 缺省 = 整堆拿起（旧行为，向后兼容）。仅对可堆叠物有意义。
  int32 count = 2;
}

// **换手**（拿起 A 后点到已占格上的 B）：把手上那件放到 B 的位置，**同时**把 B 拿到手上。
//
// 为什么必须是一条消息（而不是"先从手上放下、再把 B 拿起"两步）：鼠标位只有一个 ——
// A 还在手上时 `TakeToHand(B)` 必然回 `handBusy`；而"先把 A 放下"又要求 B 让开那一格。
// 两步在任何顺序下都会撞死。原版的换手本来就是**原子**的
// （`ChangeInvenItem`：源落进目标格 + 被撞件上鼠标，客户端一次做完、服务器事后只记位置），
// 我们把它显式化成一条消息，服务端用"两行互换"的写库原语落地（`ItemStorageService.writeMoved`）。
message C2S_BagSwap {
  int64 hand_uid = 1;     // 手上那件（服务端按 (EQUIP, HELD_SLOT) 校验，防客户端乱指）
  int64 target_uid = 2;   // 被换进手里那件（必须在背包/仓库画布上）
  // **手上那件的落点**（客户端算出的锚格）。必须带上：目标件的锚格常常不是落点 ——
  // 2×4 放到一个 2×3 旁边时，两者足迹只是**部分重叠**，落点(如 x7y8) 与被撞件锚格(如 x8y9) 不同；
  // 服务端若拿"被撞件的锚格"当落点去校验，就会把一次合法换手判成越界（实测 2026-09-14）。
  int32 to_location = 3;
  int32 to_slot = 4;
}

// 背包内移动/换格（含背包↔仓库）：toLocation/toSlot 为画布目标（location+slot）
message C2S_InventoryMove {
  int64 uid = 1;
  int32 to_location = 2;
  int32 to_slot = 3;
}

// 背包布局上报（客户端网格权威，全量快照 + 单调递增序号）：
// 一次手势/整理后客户端上报全部受影响/全部物品的最终格子（绝对位置）。
// seq = 客户端全局单调递增序号：服务端记录 lastSeq，丢弃 seq<=lastSeq 的乱序/重放包。
// SnapshotEntry 仅含 (uid,location,slot)，不带 count（count 全走服务端事件点）。
message SnapshotEntry {
  int64 uid = 1;
  int32 location = 2;   // 目标容器（十进制分段：0 装备 / 1 副装备 / 10 背包页 / 30 仓库页）
  int32 slot = 3;       // 目标槽位（一维化：背包页 0~143 / 仓库 0~80 / 装备与副装备 1~13）
}
message C2S_BagLayout {
  int32 seq = 1;                        // 客户端单调递增序号（乱序防护）
  repeated SnapshotEntry entries = 2;   // 全量快照条目
}

// 药水堆叠合并：src 并入 dst（同 itemlist & 可堆叠；服务端校验后计数并入、src 软删）
message C2S_StackMerge {
  int64 src_uid = 1;
  int64 dst_uid = 2;
}

// 穿装备：背包物品 uid → 装备槽(1~13)
message C2S_EquipItem {
  int64 uid = 1;
  int32 equip_slot = 2;
}

// 脱装备：装备槽(1~13) → 背包空位
message C2S_UnequipItem {
  int32 equip_slot = 1;
}

// W 键武器切换（主装备 slot1/2 ↔ 备用武器槽）
message C2S_SwitchWeapon {
}

// 属性分配（服务端权威）：points 为加点到指定属性的点数（当前恒 1）；
// stat="undo" 撤销最近一次分配（最多回退 5 次，对齐原版 TempStatePoint[5] 会话历史）。
message C2S_AllocateStat {
  string stat = 1;   // strength / spirit / talent / agility / health / undo
  int32 points = 2;
}

message S2C_PlayerAppear {
  int64 player_id = 1;
  string name = 2;
  int32 class_id = 3;
  int32 level = 4;
  Position position = 5;
  int32 hp = 6;
  int32 max_hp = 7;
  CharacterAppearance appearance = 8;  // 完整外观（头/防具/时装/武器），客户端据此渲染远端
  float angle = 9;                     // 当前朝向（弧度，0=+Z），远端出现即正确显示朝向
  string clan_name = 10;               // 公会名（clandb.ul.clanname），无公会为空串（头顶名牌）
  string clan_mark = 11;               // 公会图标（clandb.clanlist.iconid 转字符串），无公会为空串
  // ⚠ 12/13 曾是 walk_speed/run_speed —— 在这条消息里它们**只**用来缩放动画播放速度
  //（旁观者不需要速度值本身：远端位置是插值出来的），现改由服务端直接算成速率下发，故废弃保号。
  reserved 12, 13;
  reserved "walk_speed", "run_speed";
  // 走/跑**动画速率** = 实际速度 ÷ 1档速度（服务端算好；客户端直接用，不再本地换算）
  float anim_walk_rate = 14;
  float anim_run_rate = 15;
  // 该玩家**此刻正在播的那一条动画**（服务端缓存其最近一次上报：`C2S_PlayerMove` / `C2S_AttackStart`）。
  // 语义与 `S2C_PlayerMove.anim_index/anim_clip` **完全一致**（同一个 `SemanticEntry.clip` 校验口径），
  // 用途只有一个：**进视野时对齐** —— 否则"出现时正在挥砍/施法/走路"的玩家只能先站住，
  // 丢掉当前这一条动作（用户 2026-09-23："客户端经常丢掉远端玩家的第一下攻击动画"）。
  // ⚠ 不带进度：客户端从该条目的第 0 帧播起（与"起手广播迟到补播"同一口径）。
  int32 anim_index = 16;
  string anim_clip = 17;
}

message S2C_PlayerDisappear {
  int64 player_id = 1;
}

message S2C_PlayerMove {
  int64 player_id = 1;
  Position position = 2;   // 权威位置 world float
  float angle = 3;         // 朝向弧度（0=+Z 北）
  int32 anim_state = 4;    // 动画状态值（客户端 STATE 枚举值: 0x0040 STAND / 0x0050 WALK / 0x0060 RUN）
  int64 timestamp = 5;
  int32 anim_index = 6;    // 该玩家客户端上报的**动画条目索引**（原样透传）→ 旁观者直接播同一条
  string anim_clip = 7;    // 同一条的语义 ID（校验两端动画数据是否同代）
  // 使用道具广播（仅 anim_state=EAT 时有意义）：旁观者据此播粒子+音，与自机同一套表现。
  // use_seq 每次使用自增（0=非使用道具）——旁观者用它去重：同一玩家站着连喝两瓶，
  //   (anim_state, anim_index) 完全相同，只靠前两项去重会**吞掉第二次**。
  // use_item_idcode 是该道具的 idcode → 旁观者用与自机同一个 useEffectKindOf 推表现种类
  //   （服务端不解释表现，只透传"用了哪件"，与 anim_index/anim_clip 同一原则）。
  int32 use_seq = 8;
  int32 use_item_idcode = 9;
}

// 进入游戏：选角色成功后服务端主动下发（对齐原版 RECORDDATA 进图语义）。
// 含出生地图/位置/完整外观，客户端据此进图并渲染自机。
message S2C_EnterGame {
  int64 player_id = 1;
  int32 map_id = 2;
  Position position = 3;               // 出生点（服务端权威，FieldMap.startPoint）
  CharacterAppearance appearance = 4;  // 完整外观，客户端据此渲染自机
  Rotation rotation = 5;               // 出生朝向（ay=引擎角度 0-4095，如 ANGLE_270=3072 面向 -X）
  // 地图安全区表（gamedb.maplist.typemap='Cities' 即安全区）：客户端本地换图时判定村庄/野外动画姿态
  repeated MapInfo maps = 6;
}

message S2C_PlayerState {
  int64 player_id = 1;
  Position position = 2;
  int32 map_id = 3;
  int32 hp = 4;
  int32 mp = 5;
  int32 max_hp = 6;
  int32 max_mp = 7;
  int32 level = 8;
  int64 gold = 9;
  int64 exp = 10;
  string player_name = 11;
  int32 sp = 12;   // 耐力(体力)当前值
  int32 max_sp = 13;
  int64 next_exp = 14; // 升到下一级所需累计经验（HUD EXP 条）
  int32 move_speed = 15; // 移动速度点数(1-9)
  int32 walk_speed = 16; // 走路速度(游戏单位/秒) —— 客户端用它推进**本地移动步长**，保留
  int32 run_speed = 17;  // 跑步速度(游戏单位/秒)
  // 走/跑动画速率 = 实际速度 ÷ 1档速度（服务端算好；客户端不再本地换算）
  float anim_walk_rate = 19;
  float anim_run_rate = 20;
  // 当前等级起点的**累计**经验（= expForLevel(level)）。经验是累计值，
  // 所以「本级已获得 / 本级升级所需」= (exp - level_exp) / (next_exp - level_exp)。
  int64 level_exp = 18;
}

// 玩家死亡：客户端据此播 DEAD 动画（躺下停在末帧）+ 弹复活选项 + 倒计时。
// 死亡**不再立刻复活** —— 玩家在三个选项里选（原版 `sinInterFace.h`：
// RESTART_FEILD=1 附近重生点 / RESTART_TOWN=2 村庄 / RESTART_EXIT=3 继续躺）。
message S2C_PlayerDeath {
  int64 player_id = 1;
  int64 exp_loss = 2;            // 已废弃（代价随选项不同，改由下面几个字段给出）；字段号保留不动
  int32 force_respawn_ms = 3;    // 强制复活倒计时（1 分钟）—— 客户端 UI 显示
  // 4/5/6 原为"死亡代价的具体点数"（exp_loss_field / gold_loss_field / exp_loss_town）。
  // 用户 2026-09-13：UI 只显示**比例**（"代价：10% 经验与金币"），具体点数既没价值又是重复信息，
  // 故删除；字段号保留，避免以后被复用到语义不同的地方。
  reserved 4, 5, 6;
}

// 服务端权威换图通知：findMapPrecise 判定玩家跨图后下发（无缝大世界坐标连续）。
// 客户端据此对齐 currentMapId 并同步区域/音频/姿态——本地判定是高频预判，本消息是权威校准。
message S2C_MapSwitched {
  int64 player_id = 1;
  int32 from_map_id = 2;
  int32 map_id = 3;
  // 跨图后的服务端权威坐标（无缝大世界下与上报值一致；保留用于未来校准）
  Position position = 4;
}

message S2C_PlayerRespawn {
  int64 player_id = 1;
  Position position = 2;
  int32 hp = 3;
  int32 mp = 4;
  int32 map_id = 5;    // 复活所在图（与当前图不同时客户端要换图 + 走加载遮罩）
  int32 max_hp = 6;
  int32 reason = 7;    // 1=附近重生点 2=村庄 3=强制（倒计时到）
}

// 传送（不连续位移）。**一次广播同时服务两个受众**：
//   本人（player_id == 自己）→ 把自己搬过去、必要时换图走加载遮罩；
//   旁观者 → 把该 actor 挪到新位置（目标图不是当前图则摘掉显示）。
// 与 S2C_PlayerRespawn 的区别：不含 hp/max_hp/死亡语义，纯粹是"位置跳变"，
// 因此可复用给脱困、传送道具、GM 传送、未来的传送门。
message S2C_PlayerTeleport {
  int64 player_id = 1;
  int32 map_id = 2;
  Position position = 3;
  float angle = 4;
  int32 reason = 5;    // 0=未知 1=脱困 2=GM 3=传送道具（客户端只做展示，不参与判定）
}

// 升级广播：本人（player_id == self）→ 播升级音 + 特效；观察者 → 播特效。
// 显式事件替代原版的"等级位 diff"（参见设计文档 §1.3 隐式 diff 的差距）。等级由服务端已下发的
// S2C_PlayerState/CharacterStatus 携带，客户端无需在这里缓存 level，只当"播演的触发器"。
message S2C_LevelUpBroadcast {
  int64 player_id = 1;
  int32 level = 2;
}

// 脱困请求（系统菜单"脱离卡死"按钮 / 聊天框 /unstuck 都走它）。
// 服务端权威计算落点：本图离玩家最近的 StartPoint（无数据则回村庄出生点），零代价。
message C2S_Unstuck {
}

// 死亡后的复活选择（对应上面三个 RESTART_* 常量）
message C2S_RespawnChoice {
  int32 choice = 1;    // 1=附近重生点（10% 本级经验 + 10% 金币）/ 2=村庄（1% 本级经验）/ 3=继续躺
}

// 角色信息面板完整数据（C 键角色面板 + HUD 联动）。
// 进图 / 属性分配 / 战斗血量变化时服务端推送，客户端据此刷新面板与 HUD 条。
message S2C_CharacterStatus {
  int64 player_id = 1;
  string name = 2;          // 角色名
  int32 job = 3;            // 职业(1-10)
  int32 level = 4;
  int64 exp = 5;            // 当前累计经验
  int64 next_exp = 6;       // 升到下一级所需累计经验
  int64 gold = 7;
  int32 strength = 8;
  int32 spirit = 9;
  int32 talent = 10;
  int32 agility = 11;
  int32 health = 12;
  int32 state_point = 13;   // 未分配属性点
  int32 total_stat_points = 14;
  int32 hp = 15;
  int32 max_hp = 16;
  int32 mp = 17;
  int32 max_mp = 18;
  int32 sp = 19;            // 耐力(体力)
  int32 max_sp = 20;
  int32 attack_min = 21;    // 基础攻击下限
  int32 attack_max = 22;    // 基础攻击上限
  int32 attack_rating = 23; // 命中率
  int32 defense = 24;       // 防御力
  int32 absorption = 25;    // 吸收率
  int32 move_speed = 26;    // 移动速度点数(1-9)
  int32 walk_speed = 27;    // 走路速度(游戏单位/秒)
  int32 run_speed = 28;     // 跑步速度(游戏单位/秒)
  // 走/跑动画速率 = 实际速度 ÷ 1档速度（服务端算好；客户端不再本地换算）
  float anim_walk_rate = 45;
  float anim_run_rate = 46;
  int32 attack_speed = 29;  // 攻击速度(装备累加)
  int32 critical = 30;      // 暴击率(上限50)
  int32 block = 31;         // 格挡率
  int32 shooting_range = 32;// 射程
  int32 max_weight = 33;    // 负重上限
  int32 res_bionic = 34;    // 生物抗性
  int32 res_poison = 35;    // 毒抗性
  int32 res_fire = 36;      // 火抗性
  int32 res_lightning = 37; // 雷抗性
  int32 res_ice = 38;       // 冰抗性
  int32 avoid = 39;         // 回避率(%): 100 - 命中率(原版 Accuracy 表，按自身攻防，"躲避"为命中率补集)
  float hp_regen = 40;      // 每秒生命恢复（0.1 精度，同 RegenerationService 结算口径）
  float mp_regen = 41;      // 每秒魔法恢复
  float stm_regen = 42;     // 每秒体力恢复（含天生 3.8 + Level/7）
  int32 current_weight = 43; // 当前负重（背包+装备+备用武器；药水按瓶数），与 max_weight 同口径
  // 当前等级起点的累计经验（同 S2C_PlayerState.level_exp）：角色面板显示
  // 「本级已获得 / 本级升级所需」用，避免只显示一个「剩余所需」看不出进度。
  int64 level_exp = 44;
  // 技能点（**派生量**：等级 + 任务位 − 已花，不落盘）：面板显示用，学技能/洗点/升级后都会推
  int32 skill_point = 47;          // 1–3 转池的剩余点
  int32 special_skill_point = 48;  // 4 转池的剩余点
  // 转职阶级（原版 smCharInfo.ChangeJob：0=1转…3=4转；JobService 按等级 20/40/60 推进）。
  // 面板职业名按它取 jobTier[rank]；头模档位走 S2C_AppearanceUpdate.rank（外观链），这里是面板链。
  int32 rank = 49;
}

// 外观更新：穿/脱装备、W 武器切换后服务端推送，客户端据此更新 3D 角色模型。
// player_id=自己 → 更新自机；否则更新对应远端玩家。
message S2C_AppearanceUpdate {
  int64 player_id = 1;
  CharacterAppearance appearance = 2;
}

// ==================== 怪物消息 (300-399) ====================

message S2C_MonsterAppear {
  int64 monster_id = 1;
  int32 template_id = 2;
  string name = 3;
  int32 level = 4;
  Position position = 5;
  int32 hp = 6;
  int32 max_hp = 7;
  string model_file = 8; // 客户端渲染资源（资产相对路径，如 char/monster/monimp/monimp-a.inx）
  float angle = 9;       // 面朝方向（弧度，0=Z+）
  // 尸体：这只怪已死，但仍在 AOI 内可见（服务端发 S2C_MonsterDisappear 才移除）。
  // **必须显式下发，不能由客户端从 hp==0 推** —— 那种隐式信号改一次 hp 语义就会静默失效。
  // 谁需要它：`S2C_MonsterDeath` 只发给死亡当刻在场（在可见集里）的观察者，
  // 中途走进视野或重连的观察者拿不到死亡事件，只能靠 Appear 上的这个标记
  // 把"尸体"和"活怪"区分开（否则会看到尸体站着）。
  bool dead = 10;
  int32 monster_effect_id = 11; // 怪物音效/特效 ID（对应 C++ dwCharSoundCode / EMonsterEffectID）
  // 动画**播放速率倍率**（相对客户端基准 `ANIM_UNITS_PER_SEC`）= 步进 × 70 ÷ 4800。
  // 服务端持有 `attackspeed` 档位（客户端没有），算好下发 —— 客户端直接当 `animRate` 用。
  // 这样 `attackspeed` 才真正作用于动画速度（快怪动画播得快），且与**服务端算的动画时长同源**
  // （服务端"等动画播完"必须等于客户端实际播完的时间）。
  float anim_rate = 12;
  // ==================== 召唤物归属（怪物水晶） ====================
  // 这两项只在"这只怪是玩家召唤出来的"时非零/非空 —— 不另发一条"这是召唤物"的消息，
  // 用 `owner_entity_id > 0` 作唯一判据（原版对应 `smCharInfo.Brood == smCHAR_MONSTER_USER`）。
  //
  // 为什么是**显式字段**而不是复用别的：原版把主人名字塞进 `szModelName2+1`、把主人 serial
  // 塞进 `smCharInfo.Next_Exp`（都是借字段用），任何读那两个字段的代码都得知道这个约定；
  // 我们全部显式化（见 game-server `Monster` 的归属字段注释）。
  //
  // 客户端用途：① 认出"这是我自己的召唤物"（不可攻击、不被裁剪、名牌画蓝）；
  // ② 在名牌第二行画 `(主人名)`（原版 `Winmain.cpp:4010-4019` 的画法）。
  int64 owner_entity_id = 13; // 主人的**运行时实体 id**（PlayerEntity.getId()）；0 = 不是召唤物
  string owner_name = 14;     // 主人角色名（名牌第二行 `(名字)`）
  // 剩余寿命（只对召唤物非零）：客户端据此在名牌下画一条**按比例**收缩的倒计时条（用户 2026-09-23 要求）。
  //
  // 为什么是**两个数**（总量 + 剩余）而不是一个：条要按"剩余 / 总量"比例画，只给剩余量的话
  // 客户端要么把寿命公式（4 分钟 + 主人等级×2 秒）抄一份 —— 服务端规则出现第二份实现 ——
  // 要么在"走出视野再走回来"收到新 Appear 时把进度重置成满格。两个都由服务端给，客户端只做除法。
  //
  // 客户端以**收到 Appear 的时刻**为锚点本地倒数；服务端到点照旧自己收场，所以本地倒数只是显示，
  // 与判定不一致也不影响正确性（重新进入视野会收到新 Appear ⇒ 自动校正）。
  int32 summon_life_total_ms = 15;     // 总寿命（毫秒）；0 = 不是召唤物
  int32 summon_life_remaining_ms = 16; // 自本消息发出时算起还剩多少毫秒
}

message S2C_MonsterDisappear {
  int64 monster_id = 1;
}

message S2C_MonsterMove {
  int64 monster_id = 1;
  Position position = 2;
  float angle = 3;      // 面朝方向（弧度，0=Z+）
  int32 anim_state = 4; // 动画 token：0x0040 STAND / 0x0050 WALK / 0x0060 RUN / 0x0100 ATTACK
  // 该状态的**条目索引**（.inx 序号）—— 服务端从 monster-anim.json 里选定的变体，
  // 客户端直接 playMotion(该条目)。与玩家 anim_index 同一语义（谁决定谁下发，见 docs/chars/动画同步.md）。
  int32 anim_index = 5;
}

message S2C_NpcAppear {
  int64 entity_id = 1;    // 运行时实体 id（EntityIdSource，每次摆放唯一）；npclist 定义 id 不下发
  string name_key = 2;    // 本地化 key（npclist.name 的 slug，如 miscellaneous_store_lynn）
  string model_file = 3;  // 模型路径（npclist.gamefile，如 char\npc\TN-005\TN-005.ini）
  Position position = 4;  // world 坐标（服务端已 /256）
  float angle = 5;        // 面朝方向（弧度，0=Z+）
}

message S2C_NpcDisappear {
  int64 entity_id = 1;
}

message S2C_MonsterState {
  int64 monster_id = 1;
  MonsterState state = 2;
  int64 target_id = 3;
}

message S2C_MonsterDeath {
  int64 monster_id = 1;
  int64 killer_id = 2;
  int32 exp = 3;
  int32 gold = 4;
}

// ==================== 战斗消息 (400-499) ====================

message C2S_Attack {
  int64 target_id = 1;
}

// 起手（挥拳开始）：只广播"开始攻击"，伤害在命中帧 C2S_AttackHit 才结算
message C2S_AttackStart {
  int64 target_id = 1;
  // 本次攻击的客户端序号：用于关联 S2C_AttackPlan（防止计划与攻击错配）
  int32 client_seq = 2;
  // 本次动作的段数（= 非零 eventFrame 个数，1..4）。服务端据此预排结果，并以此作为
  // 「合法段数上限」——C2S_AttackHit 的 hit_index 超出即忽略（部分补齐 §8 的段数校验）。
  // ⚠ 该值目前由客户端声明（服务端只做 1..4 截断），完整校验需服务端持有动画表（后续）。
  int32 segments = 3;
  // 本次挥击的动画条目（同 C2S_PlayerMove.anim_index/anim_clip）：
  // 攻击动作的**变体与长度**因武器的单双手/类型而异，旁观者必须播同一条才不会"一刀两种动作"。
  int32 anim_index = 4;
  string anim_clip = 5;
}

// 命中帧（每段一次）：hit_index = 段序号（0..3，对应 motion.eventFrame 第几个非零帧）
message C2S_AttackHit {
  int64 target_id = 1;
  int32 hit_index = 2;
}

// 技能事件帧回报（与 C2S_AttackHit 同构；D7）。
// 原版的做法：客户端播动画 + 特效，动画的**事件帧**才触发伤害（`EventSkill` 那一侧，
// 每次事件帧独立结算）⇒ 我们的等价物 = 客户端在技能动作的事件帧发这条，服务端才结算该段。
// ⚠ "哪一帧是事件帧"是**动画知识**，只在客户端（服务端没有动作数据）：AGENTS #14 同源。
message C2S_SkillHit {
  int32 skill_id = 1;    // 数字 skillId（与 C2S_UseSkill 同一身份空间）
  int64 target_id = 2;   // 该段的目标怪（0 = 无目标段，如纯自身 buff）
  int32 hit_index = 3;   // 第几个事件帧（0 起，与普攻 hit_index 同口径）
}

message C2S_UseSkill {
  int32 skill_id = 1;
  int64 target_id = 2;
  Position target_position = 3;
  // 施法者**自己播的那一条**技能动作（同 C2S_AttackStart.anim_index/anim_clip，AGENTS #14）：
  // 服务端原样透传给旁观者（S2C_SkillStart），两端播同一条才不会"一招两种动作"。
  int32 anim_index = 4;
  string anim_clip = 5;
}

message S2C_AttackResult {
  int64 attacker_id = 1;
  int64 target_id = 2;
  int32 damage = 3;
  bool is_critical = 4;
  bool missed = 5;  // 未命中(MISS 飘字)；missed 时 damage=0
  int32 hit_index = 6;  // 段序号（多段攻击的第几段）
  // 源码 `AttackEffect`（character.cpp:13354 置位 / 消费点 :5166 命中特效 / effectsnd.cpp:1577
  // 追加暴击音 16 / :17712 SendTransAttack AttackState=2）。
  // ⚠ 只影响外观与武器音，**不改伤害**（真暴击另有 Power×170%，别复用 is_critical）。
  // 服务端暂恒 false，等技能接入攻击链路后再填（见任务书 T3）。
  bool attack_effect = 7;
}

// 攻击计划（B 方案）：服务端在**收到起手意图时**即裁定各段结果，随本包下发。
// 客户端据此在事件帧**直接播正确的结果音**（miss / 暴击），不必等 AttackResult —— 消灭音效延迟。
// 若本包未到（高延迟/丢包/起手被拒），客户端退回「乐观按命中」并等 AttackResult 纠正（已知最差情形）。
// ⚠ `segments` 的**长度**同时是合法段数上限：AttackHit 的 index 超出即忽略。
message S2C_AttackPlan {
  int32 client_seq = 1;     // 对应 C2S_AttackStart.client_seq
  int64 attacker_id = 2;
  int64 target_id = 3;
  repeated AttackSegment segments = 4;
}

// 单段裁定结果（字段风格对齐 S2C_AttackResult）
message AttackSegment {
  int32 index = 1;          // 段序号 = hit_index
  bool missed = 2;
  bool is_critical = 3;
  int32 damage = 4;
  // 源码 `AttackEffect`（character.cpp:13354 置位 / 消费点 :5166 命中特效 / :17712 SendTransAttack）。
  // ⚠ 只影响外观与武器音，**不改伤害**；服务端暂恒 false，等技能接入攻击链路后再填（见任务书 T3）。
  bool attack_effect = 5;
}

// 起手广播：旁观者据此立刻播放攻击者挥拳并设定挥拳时长（attack_speed）
// 技能起手广播（D7）：旁观者据此播**同一条**技能动画（含 `anim_index`/`anim_clip` 透传，AGENTS #14）。
// 原版对应物：技能动作由客户端本地起（`PlaySkillAttack`），再经状态广播让旁观者看到 ——
// 我们是显式一次性事件（丢了不补），所以起手必须**先广播、后结算**（与 S2C_AttackStart 同策）。
message S2C_SkillStart {
  int64 caster_id = 1;
  int32 skill_id = 2;
  int64 target_id = 3;
  Position target_position = 4;
  int32 anim_index = 5;   // 施法者上报的技能动作条目（原样透传）
  string anim_clip = 6;   // 同一条的语义 ID（校验两端动画数据是否同代）
}

message S2C_AttackStart {
  int64 attacker_id = 1;
  int64 target_id = 2;
  sint32 attack_speed = 3;
  int32 anim_index = 4;     // 攻击者上报的挥击动画条目（原样透传）→ 旁观者直接播同一条
  string anim_clip = 5;     // 同一条的语义 ID（校验两端动画数据是否同代）
}

message S2C_SkillAttack {
  int64 caster_id = 1;
  int32 skill_id = 2;
  int64 target_id = 3;
  int32 damage = 4;
}

// ⛔ S2C_AoeAttack（caster_id/skill_id/position/range）**已删**：它**不是原版协议** ——
// 原版 AoE 的选敌在客户端（Damage.cpp 的 dm_SelectRange/dm_SendRangeDamage 都是客户端权威），
// 服务端只按客户端报来的包结算，没有"服务端告诉客户端 AoE 圈"这条消息。
// 我们曾是服务端权威选敌（D7）⇒ 圈由客户端自己按动画事件帧的招式表现画，不需要服务端下发几何。
// （2026-09-24 用户指认"这是你臆测的"——属实，此前的"启用"是自造协议面。）

message S2C_Damage {
  int64 target_id = 1;
  int32 damage = 2;
  int32 current_hp = 3;
  // 怪打玩家的命中判定未通过（原版 sinGetMonsterAccuracy）：damage=0、血量不变，
  // 客户端在受害者头顶飘 MISS（与自机挥空同款），不播受击硬直/受击音。
  bool missed = 4;
  // 被格挡（格挡判定通过）：damage=0、血量不变，客户端飘 "Blocked" 并随机播
  // wav/effects/impact/block{1,2,3}.wav。与 missed 分开：格挡有音、miss 没有。
  bool blocked = 5;
}

// 资源回复广播（与 S2C_Damage 对称：带权威 current 值，客户端在目标头顶飘字）。
// **叫 recovery 不叫 heal**：回魔、回体力都是同一件事，heal 只覆盖了"治疗"。
// 一条消息同时带 HP 与 MP —— 一次回复可能两者都有（如药水、治疗法术），拆两条会多一次往返。
// 各自为 0 表示该项没回复（不是"回复 0 点"）。HP → 绿字，MP → 蓝字。
// ⚠ **被动缓慢回复（RegenerationService）不走这条** —— 每秒一条会把飘字刷爆（用户 2026-09-16 明确）。
message S2C_Recovery {
  int64 target_id = 1;
  int32 hp_amount = 2;     // HP 回复量（0 = 没回血）
  int32 current_hp = 3;
  int32 mp_amount = 4;     // MP 回复量（0 = 没回蓝）
  int32 current_mp = 5;
}

message S2C_BuffApply {
  int64 entity_id = 1;
  int64 buff_id = 2;
  int32 skill_id = 3;
  int32 duration = 4;
  repeated BuffEffectProto effects = 5;
}

message S2C_BuffRemove {
  int64 entity_id = 1;
  int64 buff_id = 2;
}

// ==================== 物品消息 (500-599) ====================

// 进图全量下发玩家全部物品（背包/仓库/装备/备用武器）。客户端据此重建界面。
message S2C_InventorySnapshot {
  repeated ItemProto items = 1;
  int64 gold = 2;
}

// 单件物品新增或变更（发放/移动/穿脱/属性变化后推送；客户端按 uid upsert 到所在槽）
message S2C_ItemUpdate {
  ItemProto item = 1;
}

// 物品移除（软删/丢弃）
message S2C_ItemRemove {
  int64 uid = 1;
}

message S2C_ItemUse {
  int64 uid = 1;
  int32 quantity = 2;
}

message S2C_GoldChange {
  int64 old_gold = 1;
  int64 new_gold = 2;
  string reason = 3;
}

message S2C_GroundItemAppear {
  GroundItemProto item = 1;
}

message S2C_GroundItemDisappear {
  int64 ground_item_id = 1;
}

// 批量软删通知（作弊/矛盾处置）：客户端移除这些 uid 的渲染（不回滚、不推旧快照）
message S2C_ItemRemovedUids {
  repeated int64 uids = 1;
}

// ==================== 社交消息 (600-699) ====================

message C2S_Chat {
  ChatChannel channel = 1;
  string message = 2;
  string target_name = 3;
}

message C2S_TradeRequest {
  string target_name = 1;
}

message C2S_TradeAccept {
  int64 trade_id = 1;
}

message C2S_TradeAddItem {
  int64 trade_id = 1;
  int32 item_id = 2;
  int32 quantity = 3;
}

message C2S_TradeConfirm {
  int64 trade_id = 1;
}

message C2S_PartyInvite {
  string target_name = 1;
}

message C2S_PartyAccept {
  int64 party_id = 1;
}

message C2S_PartyLeave {
}

message S2C_Chat {
  ChatChannel channel = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string message = 4;
  int64 timestamp = 5;
}

message S2C_TradeRequest {
  int64 trade_id = 1;
  int64 requester_id = 2;
  string requester_name = 3;
}

message S2C_TradeOpen {
  int64 trade_id = 1;
}

message S2C_TradeUpdate {
  int64 trade_id = 1;
}

message S2C_TradeComplete {
  bool success = 1;
  string message = 2;
}

message S2C_PartyUpdate {
  int64 party_id = 1;
  int64 leader_id = 2;
  repeated int64 member_ids = 3;
}

message S2C_PartyInvite {
  int64 party_id = 1;
  int64 inviter_id = 2;
  string inviter_name = 3;
}

// ==================== 系统消息 (900-999) ====================

message C2S_Ping {
  int64 timestamp = 1;
}

message S2C_Pong {
  int64 timestamp = 1;
}

message S2C_Error {
  ErrorCode error_code = 1;
  string error_message = 2;
  // minecraft 式翻译：key 为翻译键，params 为命名模板参数；
  // key 不在语言表时客户端 fallback 显示 key 本身
  string key = 3;
  map<string, string> params = 4;
}

message S2C_SystemMessage {
  // 兼容纯文本：无 key 时客户端直接显示 message
  string message = 1;
  int64 timestamp = 2;
  // minecraft 式翻译：key 为翻译键，params 为命名模板参数；
  // key 不在语言表时客户端 fallback 显示 key 本身
  string key = 3;
  map<string, string> params = 4;
  // 投递到哪个聊天 tab。**未设置（默认 0）一律按系统消息处理**（客户端只认 CHAT_BATTLE），
  // 所以老的发送方不用改；战斗日志（BattleLogService）显式设 CHAT_BATTLE 走"战斗"tab。
  ChatChannel channel = 5;
}

message S2C_Disconnect {
  string reason = 1;
}

// ==================== NPC 商店 ====================

// NPC 交互（点击世界里的 NPC）。客户端只报**实体 id**，服务端据此查 NPC 定义并校验距离，客户端不上报坐标。
message C2S_NpcInteract {
  int64 entity_id = 1;
}

// 买入：一次一条商品，count 只对可堆叠物（药水）有意义，其余视为 1
message C2S_ShopBuy {
  int64 entity_id = 1;
  int32 itemlist_id = 2;
  int32 count = 3;
}

// 卖出：uid 必须是**自己背包里**的那件（服务端按 uid 查，不信客户端报的位置）
message C2S_ShopSell {
  int64 entity_id = 1;
  int64 uid = 2;
  int32 count = 3;
}

// 商品行（下发用）：名字与码也发过去，客户端即使没有该物品的本地定义也能显示
message ShopItemProto {
  int32 itemlist_id = 1;
  string code = 2;
  string name = 3;
  int64 price = 4;
  // 0=武器 1=防具 2=杂货（对应 npclist 的 weaponshop/defenseshop/miscshop 三列）：
  // 一个 NPC 可以同时是武器店+防具店，所以类别挂在**行**上，客户端按它分组/分页。
  int32 kind = 5;
}

// 打开商店：kind 0=武器 1=防具 2=杂货（对应 npclist 的三列）
message S2C_ShopOpen {
  int64 entity_id = 1;
  int32 kind = 2;
  repeated ShopItemProto items = 3;
}

// ============================================================================
// 锻造 / 合成 / 力量石（2026-09-22）
// 依据见 docs/锻造与合成-源码分析.md（EU = 我们数据的血脉）与 docs/锻造与合成-我们的实现方案.md
// ============================================================================

// 合成（Mix）：把材料石投进装备，服务端按 gamedb.mixlist 匹配配方并一次性加属性
message C2S_MixItem {
  int64 target_uid = 1;                 // 目标装备（必须在背包里）
  repeated int64 stone_uids = 2;        // 投入的材料石（OS 族 14 颗，按档位计数）
}

// 锻造投石：1 颗材料石 = 1 次判定（"一键拉满"那颗走 use_item，由服务端自己找目标 —— 见 AgeService）
message C2S_AgeItem {
  int64 target_uid = 1;                 // 被锻造的装备（必须在背包里）
  int64 stone_uid = 2;                  // 材料石（Aging Stone 必成功 / Copper Ore 失败不破坏 / 其它普通石有破坏风险）
}

// 力量大师：材料石 → 力量石（我们定的规则：每颗换同档一颗）
message C2S_ForceOrbItem {
  repeated int64 stone_uids = 1;
}

// 一条生效中的 buff。目前只有力量石，将来药水/卷轴可复用。
message BuffStateProto {
  int32 item_code = 1;                  // 触发物品的原版码（力量石 = sinFO1|tier<<8）
  int32 itemlist_id = 2;                // 图标来源：客户端按它查 ItemDef（**不新增图标资产**，用物品自己的图标）
  int64 remaining_ms = 3;               // 剩余毫秒（服务端权威；客户端只做倒计时显示）
  int64 total_ms = 4;                   // 本次 buff 的总时长 —— 圆环按 remaining/total 画，缺它画不出比例
  int32 stack = 5;                      // 层数（原版可叠 buff 用；力量石恒 1，留着不猜）
}

// 生效中的 buff 列表（服务端在 buff 生效/刷新/到期时推）
message S2C_BuffState {
  repeated BuffStateProto buffs = 1;
}

// NPC 的合成窗口（合成 / 锻造 / 力量石 三选一，由服务端按 NPC 定表决定提供哪几种）。
// ⚠ modes 的取值与依据见服务端 `NpcCraftTable`（1=合成 MIX / 2=锻造 AGING / 3=力量石 FORCE，
// 判据是原版 NPC 脚本里的韩文关键字 `*아이템조합` / `*아이템에이징` / `*아이템연금`，
// **不是** NPC 名字 —— 名字当协议信号会在改名时静默失效，见 AGENTS #24）。
message S2C_CraftOpen {
  int64 entity_id = 1;     // NPC 实体 id（回给服务端做距离/身份校验用）
  repeated int32 modes = 2;
}

// 合成**预览**：客户端把当前投入的 uid 列表报上来，服务端匹配配方后把"会得到什么"发下去。
// ⚠ 客户端**不持有配方表、不做算术**（服务端算好 before/after 再下发）—— 否则就是两份匹配实现，
// 迟早出现"窗口显示 +15、物品实际 +12"这种两边都不报错的分叉。
message C2S_MixPreview {
  int64 target_uid = 1;
  repeated int64 stone_uids = 2;
}

message MixPreviewEffect {
  int32 bit = 1;          // 效果位（SIN_ADD_* / MIXEFFECT_*，三仓库一致）
  string key = 2;         // 文案 key（`mixe.*`）—— 服务端只发 key，文案在客户端 locales
  double value = 3;       // 配方里的值
  bool flat = 4;          // true = 数值直加；false = 按**当前值**百分比
  double before = 5;      // 作用前（服务端算）
  double after = 6;       // 作用后（服务端算）
  bool int_field = 7;     // 该字段是整数（客户端显示时不补小数位）
}

message S2C_MixPreview {
  bool matched = 1;
  string reason_key = 2;  // 未命中时的原因 key（`item.op.mix.*`）
  string recipe_name = 3; // 命中的配方名（客户端不查表）
  repeated MixPreviewEffect effects = 4;
}

// 锻造成功（战斗养满 或 投石）→ **附近的人都播**原版的 aging 特效 + 升级音。
// 依据：原版 `smCOMMNAD_USER_AGINGUP`（ex-machina `netplay.cpp:7290-7298`）：
//   `StartEffect(lpChar->pX,pY,pZ, EFFECT_AGING); esPlaySound(7, GetDistVolume(...), 1600);`
// 其中 `EFFECT_AGING`(5001) = `SetDynLight(255,255,255,255,200,1)` + `g_NewParticleMgr.Start("aging", pos)`
// 且 `pos.y += 10000`（`HoEffect.cpp:5979`）；音效编号 7 = 与升级同一记音，按距离衰减。
// ⚠ 只有**升级**（levelDelta > 0）才播 —— 降级/破坏在源码里没有这条命令。
message S2C_AgeUpBroadcast {
  int64 player_id = 1;   // 谁的装备锻造成功了（客户端按它找单位位置）
  int64 uid = 2;         // 哪件装备（诊断用）
  int32 level = 3;       // 成功后的等级（+N）
}

// ==================== 技能（技能点 / 学习 / 洗点） ====================

// 一条已学技能。
// **技能标识用数字 `skill_id`**（= 0x<job 1..11><tier 1..5><slot 1..4>，每段一字节、十进制值），
// 不用源码宏名（60 个技能没有宏），也不用动画下标（那是客户端自己那套，两端各自重排过一次就静默对不上）。
// 未学的技能**不下发**（键不存在 = 等级 0）。
message LearnedSkill {
  int32 skill_id = 1;  // 数字技能 id，如 0x040101（pikeman 一转一槽）
  int32 point = 2;     // 技能等级 1..10（已学的必然 ≥1）
  int32 mastery = 3;   // 熟练度 0..10000（CD 档位用）
}

// 技能表：登录 / 学习 / 洗点后各发一次。**只发本人** —— 技能点是私有的。
// 两个点数字段与 S2C_CharacterStatus 的两个同源（都走 SkillPointService.free）。
message S2C_SkillList {
  repeated LearnedSkill skills = 1;
  int32 skill_point = 2;          // 1–3 转池剩余点
  int32 special_skill_point = 3;  // 4 转池剩余点
  // **学下一级**的条件（面板 hover 用）：服务端算好下发 —— 判定规则归它（`SkillRules`），
  // 客户端不重算（`RequireLevel + 当前等级*2`、价目表公式都只在服务端一处）。
  // 只含**有价目表**的槽（1..16）；5 转槽没有价、也不属任何点池 ⇒ 不下发（面板就不显示）。
  repeated SkillLearnInfo learn_info = 4;
}

// 一个技能的"学下一级"条件（当前等级 → 下一级）。
message SkillLearnInfo {
  int32 skill_id = 1;        // 数字 skillId
  int32 next_req_level = 2;  // 学下一级所需角色等级
  int64 next_gold = 3;       // 学下一级所需金币
  // 伤害加成百分比区间（面板 hover 描述"伤害 = 攻击力 ×(1 + X%)"用）。
  // 由**服务端按该技能自己的模型**给出（各技能的伤害来源不同：有的按表加百分比、有的是固定表…），
  // 客户端不重算、也不猜。0/0 = 该技能不是"攻击力×百分比"模型（面板就不显示这一行）。
  int32 power_pct_min = 4;      // 当前显示等级
  int32 power_pct_max = 5;
  int32 next_power_pct_min = 6; // 下一级
  int32 next_power_pct_max = 7;
}

// 学/升级技能：服务端判定四道门（槽位开放 / 前置槽 / 等级 / 上限）+ 两条成本（技能点 / 钱），
// 失败回 `skill.op.*` 原因码（客户端按前缀决定是否回滚乐观 UI）。
message C2S_LearnSkill {
  int32 skill_id = 1;   // 要学/升的数字技能 id（同 LearnedSkill.skill_id）
}

// 洗点：退还全部已花技能点、清零等级与熟练度（剩余点是派生量，清键即退点）。
// 守卫 = **会话内存标记**（登录/转职清零，不落库）；被拒回 `skill.op.resetUsed`。无字段。
message C2S_ResetSkillPoints {
}

// ==================== 技能绑定（拳位 / F1~F8） ====================

// 技能绑定表：**只发本人**。`0` = 该位置**没有绑定**（拳位 0 = 普通攻击拳，就是原版
// `pLeftSkill/pRightSkill == NULL` 时那一击退化为普通攻击的状态，`playmain.cpp:2316`）。
//
// 身份是**数字 `skill_id`**（同 LearnedSkill.skill_id）：客户端据此反查图标/职业，**不存图标名、不存职业目录**
// —— 那两样都是客户端资产命名，改名即静默错位（AGENTS #24）。
message S2C_SkillBindings {
  int32 fist_left = 1;             // 左键（左拳位）绑的技能；0 = 未绑（普通攻击）
  int32 fist_right = 2;            // 右键（右拳位）绑的技能；0 = 未绑
  repeated int32 quick = 3;        // F1~F8 各绑的技能，**定长 8、下标 0 = F1**；0 = 该键未绑
}

// 改一个绑定：`kind` 1 = 拳位 / 2 = 快捷栏；`skill_id` 0 = 解绑。
// 服务端校验（不是本职业的技能、`useCode` 不允许该位置、kind/index 越界一律拒绝）
// 后写进 `characterinfo.props`（`bind.fist.left|right` / `bind.quick.<1..8>`）并回推上面的绑定表。
message C2S_SetSkillBinding {
  int32 kind = 1;      // 1 = 拳位（index 1=左 2=右）；2 = 快捷栏（index 1..8 = F1..F8）
  int32 index = 2;     // 见 kind
  int32 skill_id = 3;  // 数字技能 id；0 = 解绑（显式清掉该位置）
}
