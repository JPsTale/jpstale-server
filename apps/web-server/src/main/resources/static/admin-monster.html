<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!--PT_BASE-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="admin.monster.detailTitle">怪物详情</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo" data-i18n="admin.common.brand">PristonTale 管理</div>
      <nav class="admin-nav" id="ptNav"></nav>
    </aside>
    <main class="admin-main">
      <header class="admin-header">
        <div class="admin-header-actions">
          <span id="adminUserLabel" class="admin-user-label" data-i18n="admin.common.notLoggedIn">未登录</span>
          <button id="logoutBtn" class="btn btn-small btn-secondary" style="margin-left: 0.75rem;" data-i18n="admin.common.logout">退出登录</button>
        </div>
      </header>

      <section class="admin-card">
        <div class="action-bar">
          <a id="backLink" class="item-ref" href="./admin/monsters" data-i18n="admin.common.backToList">返回列表</a>
          <span class="dirty-badge hidden" id="dirtyBadge"></span>
          <span style="flex:1"></span>
          <button id="editBtn" class="btn btn-small" data-i18n="admin.common.edit">编辑</button>
          <button id="saveBtn" class="btn btn-small hidden" data-i18n="admin.common.save">保存</button>
          <button id="cancelBtn" class="btn btn-small btn-secondary hidden" data-i18n="admin.common.cancel">取消</button>
        </div>

        <h1 id="pageTitle" class="detail-title"></h1>
        <div id="pageStats" class="item-hint"></div>

        <div id="msgBox" class="msg hidden" role="alert"></div>
        <div id="detailBody" class="item-modal-body"></div>
      </section>
    </main>
  </div>

  <script src="./js/i18n.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/nav.js"></script>
  <script src="./js/admin-common.js"></script>
  <script src="./js/admin-detail.js"></script>
  <script src="./js/admin-monster.js"></script>
</body>
</html>
