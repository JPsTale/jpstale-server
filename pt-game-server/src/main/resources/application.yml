# No embedded web server; Netty listens on pt.game.port
spring:
  main:
    web-application-type: none
    allow-circular-references: true
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:postgresql://localhost:5432/pristontale
          username: ${DB_USER:sa}
          password: ${DB_PASSWORD:632514Go}
          driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

sa-token:
  token-name: satoken
  timeout: 86400

pt:
  game:
    port: 10007
    ws-port: 10008
    loop:
      tick-interval-ms: 50
    id: ${PT_GAME_ID:1}
    name: ${PT_GAME_NAME:Local Game Server}
    external-ip: ${PT_EXTERNAL_IP:127.0.0.1}
    external-port: ${PT_EXTERNAL_PORT:10007}
  field:
    smd-root: ${PT_SMD_ROOT:/data/PristonTale/exm/run}
