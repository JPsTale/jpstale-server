# No embedded web server; Netty listens on pt.game.port
spring:
  main:
    web-application-type: none
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:postgresql://localhost:5432/pristontale
          username: ${DB_USER:sa}
          password: ${DB_PASSWORD:632514Go}
          driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

pt:
  game:
    port: 10007
    loop:
      tick-interval-ms: 50
