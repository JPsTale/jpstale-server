# 公共配置（所有 profile 共享）
spring:
  main:
    web-application-type: none
    allow-circular-references: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  redis:
    port: 6379
    database: 0
    timeout: 10s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

sa-token:
  token-name: satoken
  timeout: 86400

pt:
  game:
    port: 10007
    ws-port: 10008
    loop:
      tick-interval-ms: 50
    id: ${PT_GAME_ID:1}
    name: ${PT_GAME_NAME:Local Game Server}
    external-ip: ${PT_EXTERNAL_IP:192.168.31.10}
    external-port: ${PT_EXTERNAL_PORT:10007}
  field:
    smd-root: ${PT_SMD_ROOT:.}
