# No embedded web server; Netty listens on pt.game.port
spring:
  main:
    web-application-type: none
    allow-circular-references: true
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:postgresql://localhost:5432/pristontale
          username: ${DB_USER:sa}
          password: ${DB_PASSWORD:632514Go}
          driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

pt:
  game:
    port: 10007
    ws-port: 10008
    loop:
      tick-interval-ms: 50
  field:
    # 地图区域数据（对齐 EU InitField 顺序，mapId 0-43）
    # smd 根目录：地图碰撞网格文件位置（.smd 头 RECT 提供地图 AABB）
    smd-root: ${PT_SMD_ROOT:/data/PristonTale/exm/run}
